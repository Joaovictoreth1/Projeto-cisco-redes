<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Web Packet Tracer Pro | SwitchLab Ultra</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        cyber: {
                            bg: '#030305',
                            surface: '#0a0a0f',
                            panel: 'rgba(10, 10, 15, 0.85)',
                            primary: '#0ea5e9',
                            accent: '#8b5cf6',
                            success: '#10b981',
                            danger: '#f43f5e',
                            warning: '#f59e0b'
                        }
                    },
                    animation: {
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'crt-flicker': 'flicker 0.15s infinite',
                        'slide-up': 'slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'pop-in': 'popIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    },
                    keyframes: {
                        dash: { 'to': { strokeDashoffset: '-24' } },
                        flicker: { '0%': { opacity: '0.95' }, '100%': { opacity: '1' } },
                        slideUp: { '0%': { opacity: '0', transform: 'translateY(15px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                        popIn: { '0%': { opacity: '0', transform: 'scale(0.9)' }, '100%': { opacity: '1', transform: 'scale(1)' } }
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --grid-color: rgba(14, 165, 233, 0.04);
            --grid-size: 40px;
        }

        body { 
            margin: 0; overflow: hidden; user-select: none; 
            background-color: #030305; color: #e2e8f0;
            -webkit-font-smoothing: antialiased;
        }

        /* Premium Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.15); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(56, 189, 248, 0.4); }
        .custom-scrollbar::-webkit-scrollbar-thumb { border-color: transparent; background-clip: padding-box; }

        .glass-panel {
            background: rgba(10, 10, 16, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
        }

        #workspace {
            background-color: #030305;
            background-image: 
                radial-gradient(circle at center, rgba(14, 165, 233, 0.05) 0%, transparent 70%),
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 100% 100%, var(--grid-size) var(--grid-size), var(--grid-size) var(--grid-size);
            background-position: center, -1px -1px, -1px -1px;
        }

        /* Dispositivos */
        .device {
            position: absolute;
            width: 80px; height: 80px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transform: translate(-50%, -50%);
            z-index: 20;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        .device-icon-wrapper {
            width: 52px; height: 52px;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, rgba(20,20,30,0.9), rgba(10,10,15,0.9));
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            backdrop-filter: blur(8px);
            transition: all 0.25s ease;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6), inset 0 1px 1px rgba(255,255,255,0.1);
            position: relative;
        }

        .device:hover .device-icon-wrapper {
            transform: translateY(-4px) scale(1.08);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 12px 25px rgba(0,0,0,0.8), inset 0 1px 2px rgba(255,255,255,0.2);
        }

        .device i { font-size: 28px; transition: color 0.3s, filter 0.3s; filter: drop-shadow(0 0 8px currentColor); }
        
        /* Device States */
        .device.selected .device-icon-wrapper {
            border-color: #0ea5e9;
            box-shadow: 0 0 25px rgba(14, 165, 233, 0.5), inset 0 0 15px rgba(14, 165, 233, 0.3);
        }
        .device.ping-src .device-icon-wrapper {
            border-color: #8b5cf6;
            box-shadow: 0 0 25px rgba(139, 92, 246, 0.5), inset 0 0 15px rgba(139, 92, 246, 0.3);
            animation: pulse-border-purple 2s infinite;
        }
        .device.cable-src .device-icon-wrapper {
            border-color: #f59e0b;
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.5), inset 0 0 15px rgba(245, 158, 11, 0.3);
            animation: pulse-border-amber 2s infinite;
        }

        @keyframes pulse-border-purple { 0%, 100% { box-shadow: 0 0 15px rgba(139,92,246,0.4); } 50% { box-shadow: 0 0 35px rgba(139,92,246,0.8); } }
        @keyframes pulse-border-amber { 0%, 100% { box-shadow: 0 0 15px rgba(245,158,11,0.4); } 50% { box-shadow: 0 0 35px rgba(245,158,11,0.8); } }

        .device-label {
            font-size: 11px; font-weight: 600; margin-top: 12px;
            background: rgba(5, 5, 8, 0.95); padding: 4px 14px;
            border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.08);
            color: #e2e8f0; pointer-events: none; white-space: nowrap;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            letter-spacing: 0.5px;
        }

        .device-ip-label {
            font-size: 9px; color: #38bdf8; font-family: 'JetBrains Mono', monospace;
            background: rgba(14, 165, 233, 0.1); padding: 2px 8px;
            border-radius: 6px; pointer-events: none; margin-top: 6px;
            border: 1px solid rgba(14, 165, 233, 0.2);
        }

        /* Cabos */
        .link-group { cursor: pointer; }
        .link-hit-area { stroke: transparent; stroke-width: 25; fill: none; pointer-events: stroke; }
        .link-line {
            stroke: rgba(148, 163, 184, 0.4); stroke-width: 3; fill: none;
            transition: stroke 0.3s, stroke-width 0.2s, filter 0.3s; pointer-events: none;
        }
        .link-group:hover .link-line {
            stroke: #f43f5e; stroke-width: 4; filter: drop-shadow(0 0 8px rgba(244, 63, 94, 0.8));
        }
        .link-group.active-flow .link-line {
            stroke: #8b5cf6; filter: drop-shadow(0 0 10px rgba(139, 92, 246, 0.8));
        }
        
        .port-light {
            fill: #10b981; stroke: #050507; stroke-width: 2;
            filter: drop-shadow(0 0 6px rgba(16, 185, 129, 0.8));
            transition: fill 0.3s, filter 0.3s;
        }
        .port-light.down { fill: #f43f5e; filter: drop-shadow(0 0 6px rgba(244, 63, 94, 0.8)); }

        .port-label {
            font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: #94a3b8;
            pointer-events: none; text-anchor: middle; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.9));
        }

        #drawing-line {
            stroke: #f59e0b; stroke-width: 3; stroke-dasharray: 8,8; fill: none;
            animation: dash 0.6s linear infinite; filter: drop-shadow(0 0 8px rgba(245, 158, 11, 0.8));
        }

        /* Pacotes SVG */
        .svg-packet {
            fill: #8b5cf6;
            filter: drop-shadow(0 0 10px #8b5cf6) drop-shadow(0 0 20px #8b5cf6);
            transition: fill 0.2s;
        }
        .svg-packet.return { fill: #10b981; filter: drop-shadow(0 0 10px #10b981) drop-shadow(0 0 20px #10b981); }
        .svg-packet.error { fill: #f43f5e; filter: drop-shadow(0 0 10px #f43f5e) drop-shadow(0 0 20px #f43f5e); }

        /* Ferramentas */
        .tool-active {
            background-color: rgba(14, 165, 233, 0.15) !important;
            color: #38bdf8 !important; border-color: rgba(14, 165, 233, 0.4) !important;
            box-shadow: inset 0 0 15px rgba(14, 165, 233, 0.2), 0 0 15px rgba(14, 165, 233, 0.2);
        }

        /* CLI */
        .cli-container {
            background-color: #020203; color: #4ade80;
            font-family: 'JetBrains Mono', monospace; box-shadow: inset 0 0 30px rgba(0,0,0,1);
            position: relative; border-radius: 0 0 12px 12px;
        }
        .cli-container::before {
            content: " "; display: block; position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2; background-size: 100% 2px, 3px 100%; pointer-events: none;
        }
        .cli-input { background: transparent; border: none; outline: none; color: #f8fafc; flex: 1; width: 100%; caret-color: #4ade80; }
        .input-glow:focus { box-shadow: 0 0 0 1px #0ea5e9, 0 0 15px rgba(14, 165, 233, 0.25); border-color: transparent; }

        /* Toasts */
        #toast-container { position: fixed; top: 70px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 12px; pointer-events: none; }
        .toast-message {
            background: rgba(15, 15, 20, 0.95); backdrop-filter: blur(12px);
            border-left: 4px solid #0ea5e9; color: white; padding: 14px 20px;
            border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            font-size: 13px; display: flex; align-items: center; gap: 12px;
            transform: translateX(120%); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s;
            pointer-events: auto; border-top: 1px solid rgba(255,255,255,0.05); border-right: 1px solid rgba(255,255,255,0.05); border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .toast-message.show { transform: translateX(0); }
        .toast-error { border-left-color: #f43f5e; } .toast-success { border-left-color: #10b981; } .toast-warning { border-left-color: #f59e0b; }

        /* Menu de Contexto */
        #context-menu {
            position: absolute; z-index: 1000;
            background: rgba(15, 15, 22, 0.95); backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 8px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            width: 180px; overflow: hidden;
            transform-origin: top left;
        }
        .context-item {
            padding: 10px 16px; font-size: 12px; color: #cbd5e1; cursor: pointer;
            display: flex; align-items: center; gap: 10px; transition: all 0.2s;
        }
        .context-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
        .context-item i { font-size: 16px; }
        .context-item.danger:hover { background: rgba(244, 63, 94, 0.15); color: #f43f5e; }
    </style>
</head>
<body class="flex flex-col h-screen text-slate-200 font-sans antialiased selection:bg-sky-500/30 selection:text-sky-200" oncontextmenu="return false;">

    <div id="toast-container"></div>

    <!-- Menu de Contexto Oculto -->
    <div id="context-menu" class="hidden">
        <div class="px-4 py-2 border-b border-white/10 text-[10px] font-bold text-slate-500 uppercase tracking-widest" id="ctx-header">Device</div>
        <div class="context-item" id="ctx-btn-config"><i class="ph ph-gear text-slate-400"></i> Configurações</div>
        <div class="context-item" id="ctx-btn-cli"><i class="ph ph-terminal text-sky-400"></i> Terminal CLI</div>
        <div class="context-item" id="ctx-btn-ping"><i class="ph ph-envelope-simple-run text-purple-400"></i> Iniciar Ping</div>
        <div class="w-full h-px bg-white/10 my-1"></div>
        <div class="context-item danger" id="ctx-btn-delete"><i class="ph ph-trash"></i> Excluir</div>
    </div>

    <!-- Modais Estruturais -->
    <div id="custom-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[100] hidden flex items-center justify-center opacity-0 transition-opacity duration-300" onclick="if(event.target===this) closeModal()">
        <div class="bg-cyber-surface border border-white/10 rounded-2xl shadow-2xl w-[420px] overflow-hidden transform scale-95 transition-transform duration-300" id="custom-modal-content">
            <div class="px-6 py-4 border-b border-white/5 flex justify-between items-center bg-white/5">
                <h3 class="text-lg font-semibold text-white flex items-center gap-2" id="modal-title">Notice</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white transition rounded-md p-1 hover:bg-white/10"><i class="ph ph-x text-lg"></i></button>
            </div>
            <div class="px-6 py-6 text-slate-300 text-sm leading-relaxed" id="modal-message">Mensagem</div>
            <div class="px-6 py-4 bg-black/40 border-t border-white/5 flex justify-end gap-3" id="modal-actions"></div>
        </div>
    </div>

    <!-- Header -->
    <header class="h-14 glass-panel flex items-center justify-between px-6 z-50 shrink-0 border-b border-white/5 relative">
        <div class="absolute inset-0 bg-gradient-to-r from-sky-500/10 via-transparent to-transparent opacity-50 pointer-events-none"></div>
        <div class="flex items-center space-x-6 relative z-10">
            <div class="flex items-center space-x-3 group cursor-default">
                <div class="bg-gradient-to-br from-sky-400 to-blue-600 p-1.5 rounded-lg shadow-[0_0_20px_rgba(14,165,233,0.5)]">
                    <i class="ph ph-activity text-white text-xl"></i>
                </div>
                <span class="font-bold text-lg tracking-tight text-white">Switch<span class="text-sky-400">Lab</span> <span class="font-normal text-[10px] text-sky-400/80 ml-1 border border-sky-400/40 bg-sky-400/10 px-1.5 py-0.5 rounded shadow-[0_0_10px_rgba(14,165,233,0.2)]">ULTRA PRO</span></span>
            </div>
            <div class="h-5 w-px bg-white/10"></div>
            <div class="text-sm font-medium text-slate-400 hover:text-white transition-colors cursor-pointer flex items-center gap-2 px-2 py-1 rounded hover:bg-white/5">
                Topologia Core <i class="ph ph-caret-down text-xs"></i>
            </div>
        </div>
        <div class="flex items-center space-x-3 relative z-10">
            <button onclick="TopologyManager.save()" class="text-slate-300 hover:text-white bg-white/5 hover:bg-white/10 border border-white/10 px-3 py-1.5 rounded-md text-sm font-medium flex items-center gap-2 transition-all hover:shadow-[0_0_15px_rgba(255,255,255,0.1)]">
                <i class="ph ph-floppy-disk text-lg"></i> Salvar
            </button>
            <button onclick="TopologyManager.load()" class="text-slate-300 hover:text-white bg-white/5 hover:bg-white/10 border border-white/10 px-3 py-1.5 rounded-md text-sm font-medium flex items-center gap-2 transition-all hover:shadow-[0_0_15px_rgba(255,255,255,0.1)]">
                <i class="ph ph-folder-open text-lg"></i> Carregar
            </button>
            <div class="w-px h-5 bg-white/10 mx-1"></div>
            <button onclick="promptClearWorkspace()" class="text-rose-400 hover:text-rose-300 bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/30 px-3 py-1.5 rounded-md text-sm font-medium transition-all hover:shadow-[0_0_15px_rgba(244,63,94,0.3)]">
                Limpar Matriz
            </button>
        </div>
    </header>

    <!-- Toolbar Central -->
    <div class="absolute top-20 left-1/2 transform -translate-x-1/2 glass-panel rounded-full px-2 py-2 flex items-center gap-1 z-40 shadow-[0_10px_40px_rgba(0,0,0,0.8)] border-white/10">
        <button onclick="ToolManager.set('pointer')" id="tool-pointer" class="tool-btn tool-active p-2 rounded-full transition text-slate-400 hover:text-sky-400 border border-transparent" title="Select / Move (Esc)">
            <i class="ph ph-cursor text-xl"></i>
        </button>
        <button onclick="ToolManager.set('cable')" id="tool-cable" class="tool-btn p-2 rounded-full transition text-slate-400 hover:text-amber-400 border border-transparent" title="Connect Cable (C)">
            <i class="ph ph-plug text-xl"></i>
        </button>
        <button onclick="ToolManager.set('ping')" id="tool-ping" class="tool-btn p-2 rounded-full transition text-slate-400 hover:text-purple-400 border border-transparent" title="Send PDU (P)">
            <i class="ph ph-envelope-simple-run text-xl"></i>
        </button>
        <div class="w-px h-6 bg-white/10 mx-1"></div>
        <button onclick="ToolManager.set('delete')" id="tool-delete" class="tool-btn p-2 rounded-full transition text-slate-400 hover:text-rose-400 border border-transparent" title="Delete Object (Del)">
            <i class="ph ph-trash text-xl"></i>
        </button>
    </div>

    <!-- Indicador de Status da Ferramenta -->
    <div class="absolute top-20 left-6 z-40 pointer-events-none">
        <div class="glass-panel px-3 py-2 rounded-lg flex items-center shadow-lg border-white/10 backdrop-blur-xl">
            <div class="w-2 h-2 rounded-full bg-sky-500 mr-2 shadow-[0_0_10px_rgba(14,165,233,1)]" id="status-dot"></div>
            <span id="tool-status" class="text-[10px] font-semibold text-slate-200 uppercase tracking-widest font-mono drop-shadow-md">Modo Seleção</span>
        </div>
    </div>

    <!-- Área de Trabalho Principal -->
    <div class="flex flex-1 overflow-hidden relative">
        <main id="workspace" class="flex-1 relative overflow-hidden">
            <svg id="cables-layer" class="absolute top-0 left-0 w-full h-full z-10"></svg>
            <svg id="drawing-cable" class="absolute top-0 left-0 w-full h-full pointer-events-none z-10 hidden">
                <path id="drawing-line" d="" />
            </svg>
            <div id="devices-layer" class="absolute top-0 left-0 w-full h-full pointer-events-none z-20"></div>
            <svg id="packets-layer" class="absolute top-0 left-0 w-full h-full pointer-events-none z-30"></svg>
        </main>

        <!-- Painel de Propriedades Lateral -->
        <aside id="properties-panel" class="w-[420px] glass-panel border-l border-t-0 border-b-0 border-white/10 flex flex-col shadow-[-10px_0_40px_rgba(0,0,0,0.8)] z-40 transition-transform duration-300 ease-[cubic-bezier(0.16,1,0.3,1)] transform translate-x-full absolute right-0 top-0 h-full bg-cyber-surface/95">
            <div class="h-16 flex items-center justify-between px-6 shrink-0 border-b border-white/5 bg-black/30">
                <div class="flex items-center gap-3">
                    <div id="prop-small-icon" class="text-sky-400 w-10 h-10 flex items-center justify-center bg-sky-400/10 rounded-xl border border-sky-400/20 shadow-[inset_0_0_15px_rgba(14,165,233,0.1)] text-2xl"></div>
                    <div>
                        <span class="font-bold text-base tracking-wide text-white block leading-tight" id="prop-header-title">Device</span>
                        <span class="text-[10px] font-mono text-sky-400/80" id="prop-header-mac">00:00:00:00:00:00</span>
                    </div>
                </div>
                <button onclick="PropertiesManager.close()" class="text-slate-400 hover:text-white transition rounded-md p-1.5 hover:bg-white/10 outline-none">
                    <i class="ph ph-x text-lg"></i>
                </button>
            </div>
            
            <div class="flex border-b border-white/5 text-[11px] font-bold text-slate-400 shrink-0 px-2 pt-2 bg-black/20 uppercase tracking-widest">
                <button class="flex-1 py-3 hover:text-white border-b-2 border-sky-500 text-sky-400 transition outline-none" id="tab-btn-config" onclick="PropertiesManager.switchTab('config')">Configuração</button>
                <button class="flex-1 py-3 hover:text-white border-b-2 border-transparent transition outline-none" id="tab-btn-cli" onclick="PropertiesManager.switchTab('cli')">Terminal CLI</button>
            </div>

            <!-- Tab Configuração -->
            <div id="tab-config" class="p-6 flex-1 overflow-y-auto bg-transparent custom-scrollbar">
                <div class="space-y-6">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">Hostname</label>
                        <input type="text" id="prop-name" class="w-full bg-black/60 border border-white/10 text-white rounded-lg px-3 py-2.5 text-sm outline-none input-glow transition font-medium" onchange="PropertiesManager.update('name')">
                    </div>
                    
                    <div id="prop-gateway-container">
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">Default Gateway</label>
                        <input type="text" id="prop-gateway" class="w-full bg-black/60 border border-white/10 text-slate-300 rounded-lg px-3 py-2.5 text-sm outline-none input-glow transition font-mono" placeholder="0.0.0.0" onchange="PropertiesManager.update('gateway')">
                    </div>

                    <div class="w-full h-px bg-white/5 my-4"></div>

                    <div id="prop-interface-container">
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 flex justify-between items-center">
                            Interface de Rede
                            <span class="text-[9px] text-sky-400 flex items-center gap-1 bg-sky-500/10 px-2 py-0.5 rounded border border-sky-500/20"><i class="ph-fill ph-circle text-[8px] animate-pulse"></i> Config</span>
                        </label>
                        <select id="prop-interface-sel" class="w-full bg-black/80 border border-white/10 text-slate-200 rounded-lg px-3 py-2.5 text-sm outline-none input-glow transition mb-4 cursor-pointer font-mono" onchange="PropertiesManager.loadInterface()"></select>
                    </div>

                    <div id="prop-ip-mask-container" class="space-y-4 bg-black/30 p-5 rounded-xl border border-white/5 relative overflow-hidden shadow-inner">
                        <div class="absolute -top-10 -right-10 w-32 h-32 bg-sky-500/10 rounded-full blur-3xl pointer-events-none"></div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">IPv4 Address</label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i class="ph ph-globe text-sky-500/50"></i></div>
                                <input type="text" id="prop-ip" class="w-full bg-black/80 border border-sky-500/20 text-sky-400 rounded-lg pl-9 pr-3 py-2.5 text-sm outline-none input-glow transition font-mono font-bold shadow-[inset_0_0_10px_rgba(0,0,0,0.5)]" placeholder="0.0.0.0" onchange="PropertiesManager.update('ip')">
                            </div>
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">Subnet Mask</label>
                            <input type="text" id="prop-mask" class="w-full bg-black/60 border border-white/10 text-slate-300 rounded-lg px-3 py-2.5 text-sm outline-none input-glow transition font-mono" placeholder="255.255.255.0" onchange="PropertiesManager.update('mask')">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tab CLI -->
            <div id="tab-cli" class="flex-1 cli-container p-4 hidden flex-col relative m-3 border border-white/10 shadow-[0_0_20px_rgba(0,0,0,0.5)]">
                <div id="cli-output" class="whitespace-pre-wrap flex-1 break-words overflow-y-auto text-[13px] leading-relaxed pb-12 custom-scrollbar pr-2 z-10 relative"></div>
                <div class="flex items-center mt-2 shrink-0 absolute bottom-0 left-0 right-0 bg-[#020203] py-3 px-4 border-t border-white/10 z-10">
                    <span id="cli-prompt" class="font-bold text-sky-400">R1></span>
                    <input type="text" id="cli-input" class="cli-input ml-2 text-[13px] font-bold text-white font-mono" autocomplete="off" spellcheck="false" placeholder="_">
                </div>
            </div>
        </aside>

        <!-- Monitor de PDUs -->
        <div id="pdu-panel" class="absolute bottom-6 right-6 w-[360px] glass-panel shadow-2xl rounded-xl flex flex-col z-30 overflow-hidden transition-all duration-300 border-white/10 hidden">
            <div class="bg-black/80 px-4 py-3 text-[10px] font-bold uppercase tracking-widest border-b border-white/5 flex justify-between items-center text-slate-300">
                <div class="flex items-center gap-2">
                    <i class="ph ph-radar text-sky-400 text-sm animate-pulse"></i> Trafégo de Rede
                </div>
                <button onclick="NetworkLogger.clear()" class="hover:text-rose-400 transition bg-white/5 hover:bg-white/10 border border-white/10 px-2 py-0.5 rounded outline-none shadow-sm">Limpar</button>
            </div>
            <div id="pdu-list" class="h-56 overflow-y-auto text-[12px] p-3 space-y-2 custom-scrollbar bg-black/30">
                <div class="text-slate-500 text-center italic mt-16 font-mono text-[11px] placeholder-text">Aguardando pacotes...</div>
            </div>
        </div>
    </div>

    <!-- Catálogo de Equipamentos -->
    <footer class="h-32 glass-panel border-t border-white/10 flex z-40 shadow-[0_-15px_40px_rgba(0,0,0,0.8)] shrink-0 bg-[#030305]/95 relative">
        <div class="absolute inset-0 bg-gradient-to-t from-black/50 to-transparent pointer-events-none"></div>
        <div class="w-24 bg-black/50 border-r border-white/5 flex flex-col shrink-0 py-2 gap-1 items-center justify-center relative z-10">
            <button onclick="CatalogManager.selectCategory('routers')" class="w-16 h-10 rounded-lg hover:bg-white/5 flex items-center justify-center transition group outline-none" id="cat-routers" title="Routers">
                <i class="ph ph-cpu text-2xl text-slate-500 group-hover:text-rose-500 transition-colors drop-shadow-md"></i>
            </button>
            <button onclick="CatalogManager.selectCategory('switches')" class="w-16 h-10 rounded-lg hover:bg-white/5 flex items-center justify-center transition group outline-none" id="cat-switches" title="Switches">
                <i class="ph ph-share-network text-2xl text-slate-500 group-hover:text-emerald-500 transition-colors drop-shadow-md"></i>
            </button>
            <button onclick="CatalogManager.selectCategory('end_devices')" class="w-16 h-10 rounded-lg flex items-center justify-center transition group bg-white/10 shadow-[inset_0_0_15px_rgba(0,0,0,0.5)] outline-none border border-white/5" id="cat-end_devices" title="End Devices">
                <i class="ph ph-desktop text-2xl text-sky-400 transition-colors drop-shadow-[0_0_8px_rgba(56,189,248,0.5)]"></i>
            </button>
        </div>
        <div class="flex-1 px-6 py-4 flex gap-5 overflow-x-auto items-center bg-transparent custom-scrollbar relative z-10" id="equipment-list"></div>
    </footer>

    <script>
        'use strict';

        // --- SISTEMA DE NOTIFICAÇÕES ---
        const Toast = {
            show(message, type = 'success', duration = 3000) {
                const container = document.getElementById('toast-container');
                const toast = document.createElement('div');
                let icon = 'check-circle', typeClass = 'toast-success';
                
                if(type === 'error') { icon = 'x-circle'; typeClass = 'toast-error'; }
                if(type === 'warning') { icon = 'warning'; typeClass = 'toast-warning'; }
                if(type === 'info') { icon = 'info'; typeClass = 'toast-message'; }

                toast.className = `toast-message ${typeClass}`;
                toast.innerHTML = `<i class="ph-fill ph-${icon} text-lg drop-shadow-md"></i> <span class="font-medium">${message}</span>`;
                
                container.appendChild(toast);
                requestAnimationFrame(() => toast.classList.add('show'));

                setTimeout(() => {
                    toast.classList.remove('show');
                    setTimeout(() => toast.remove(), 400);
                }, duration);
            }
        };

        // --- DADOS E ESTADO ---
        const ICONS = {
            router: `<i class="ph-fill ph-cpu text-rose-500"></i>`,
            switch: `<i class="ph-fill ph-share-network text-emerald-500"></i>`,
            pc: `<i class="ph-fill ph-desktop text-sky-400"></i>`,
            laptop: `<i class="ph-fill ph-laptop text-sky-400"></i>`,
            server: `<i class="ph-fill ph-hard-drives text-sky-400"></i>`,
            cloud: `<i class="ph-fill ph-cloud text-purple-400"></i>`
        };

        const CATEGORIES = {
            routers: [ 
                { id: 'vios', name: 'R', label: 'vIOS Router', type: 'router', color: 'rose' },
                { id: 'csr', name: 'CSR', label: 'CSR1000v', type: 'router', color: 'rose' }
            ],
            switches: [ 
                { id: 'l2', name: 'SW', label: 'L2 Switch', type: 'switch', color: 'emerald' },
                { id: 'l3', name: 'MLS', label: 'L3 Switch', type: 'switch', color: 'emerald' }
            ],
            end_devices: [
                { id: 'pc', name: 'PC', label: 'Desktop PC', type: 'pc', color: 'sky' },
                { id: 'laptop', name: 'Laptop', label: 'Laptop', type: 'laptop', color: 'sky' },
                { id: 'server', name: 'Server', label: 'Data Server', type: 'server', color: 'sky' },
                { id: 'cloud', name: 'Cloud', label: 'WAN Emul', type: 'cloud', color: 'purple' }
            ]
        };

        const CLI_COMMANDS = ['ping', 'traceroute', 'ipconfig', 'arp', 'clear', 'enable', 'disable', 'configure terminal', 'exit', 'show ip route', 'show ip interface brief'];

        const State = {
            devices: [], links: [], deviceCounter: 1,
            selectedTool: 'pointer', currentCategory: 'end_devices',
            itemToPlace: null, activeDevice: null, draggingDevice: null,
            cableSourceDevice: null, pingSourceDevice: null,
            cliHistoryBuffer: {}, contextMenuTarget: null
        };

        // --- UTILITÁRIOS ---
        const Utils = {
            generateMAC: () => "00:" + Array.from({length:5}, () => Math.floor(Math.random()*256).toString(16).padStart(2,'0')).join(':'),
            ipToLong: (ip) => {
                if(!ip) return 0;
                const parts = ip.split('.');
                return parts.length !== 4 ? 0 : parts.reduce((acc, octet) => (acc << 8) + parseInt(octet, 10), 0) >>> 0;
            },
            isSameSubnet: (ip1, mask1, ip2, mask2) => {
                if(!ip1 || !mask1 || !ip2 || !mask2) return false;
                return (Utils.ipToLong(mask1) === Utils.ipToLong(mask2)) && ((Utils.ipToLong(ip1) & Utils.ipToLong(mask1)) === (Utils.ipToLong(ip2) & Utils.ipToLong(mask2)));
            },
            getNetworkStr: (ip, mask) => {
                if(!ip || !mask) return "Unconfigured";
                let i = ip.split('.').map(Number), m = mask.split('.').map(Number);
                if(i.length !== 4 || m.length !== 4) return "Invalid";
                let net = i.map((oct, idx) => oct & m[idx]).join('.');
                let cidr = m.reduce((acc, val) => acc + val.toString(2).split('1').length - 1, 0);
                return `${net}/${cidr}`;
            },
            calculateGravityCurve: (x1, y1, x2, y2) => {
                const dx = x2 - x1, dy = y2 - y1;
                const distance = Math.sqrt(dx*dx + dy*dy);
                const sag = distance * 0.18; // Curva um pouco mais pronunciada
                const controlX = (x1 + x2) / 2;
                const controlY = Math.max(y1, y2) + sag + 20;
                return `M ${x1} ${y1} Q ${controlX} ${controlY} ${x2} ${y2}`;
            }
        };

        // --- CLASSES ---
        class NetworkDevice {
            constructor(typeStr, namePref, x, y) {
                this.id = 'dev_' + Date.now() + '_' + State.deviceCounter++;
                this.typeStr = typeStr; this.name = namePref + (State.deviceCounter - 1);
                this.x = x; this.y = y;
                this.cliOutput = [
                    `SwitchLab OS (tm) Software, Version 16.09(1)E`,
                    `Copyright (c) 1986-2026 by SwitchLab Systems, Inc.`,
                    `Compiled by sysadmin\n`,
                    `%SYS-5-RESTART: System restarted --`,
                    `Device ${this.name} initialized.\n`
                ];
                State.cliHistoryBuffer[this.id] = { cmds: [], index: -1 };
            }
            get isLayer3() { return ['pc', 'laptop', 'server', 'router'].includes(this.typeStr); }
        }

        class EndDevice extends NetworkDevice {
            constructor(typeStr, namePref, x, y) {
                super(typeStr, namePref, x, y);
                this.interfaces = [{ name: 'eth0', ip: '', mask: '255.255.255.0', mac: Utils.generateMAC(), connectedTo: null }];
                this.gateway = ''; this.prompt = 'user@' + this.name.toLowerCase() + ':~$ ';
                this.cliOutput = [`Linux ${this.name.toLowerCase()} 6.2.0-generic #1 SMP PREEMPT_DYNAMIC x86_64\n`];
            }
        }
        class Router extends NetworkDevice {
            constructor(typeStr, namePref, x, y) {
                super(typeStr, namePref, x, y);
                this.interfaces = [
                    { name: 'GigabitEthernet0/0', ip: '', mask: '255.255.255.0', mac: Utils.generateMAC(), connectedTo: null },
                    { name: 'GigabitEthernet0/1', ip: '', mask: '255.255.255.0', mac: Utils.generateMAC(), connectedTo: null }
                ];
                this.prompt = this.name + '>';
            }
        }
        class Switch extends NetworkDevice {
            constructor(typeStr, namePref, x, y) {
                super(typeStr, namePref, x, y);
                this.interfaces = Array.from({length: 8}, (_, i) => ({ name: `Fa0/${i+1}`, mac: Utils.generateMAC(), connectedTo: null }));
                this.prompt = this.name + '>';
            }
        }
        class Cloud extends NetworkDevice {
            constructor(typeStr, namePref, x, y) {
                super(typeStr, namePref, x, y);
                this.interfaces = [{ name: 'WAN0', ip: '8.8.8.8', mask: '0.0.0.0', mac: Utils.generateMAC(), connectedTo: null }];
                this.prompt = 'cloud> ';
            }
        }

        // --- MANAGERS ---
        const ToolManager = {
            set(tool) {
                State.selectedTool = tool; State.itemToPlace = null;
                State.cableSourceDevice = null; State.pingSourceDevice = null;
                
                document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('tool-active'));
                document.getElementById('tool-' + tool)?.classList.add('tool-active');
                document.querySelectorAll('.equipment-item').forEach(el => el.className = el.className.replace(/ring-2 ring-\w+-500 bg-white\/10/, ''));
                
                document.getElementById('drawing-cable').classList.add('hidden');
                State.devices.forEach(d => document.getElementById(d.id)?.classList.remove('ping-src', 'cable-src'));

                const workspace = document.getElementById('workspace');
                if(tool === 'pointer') { this.updateStatus('Mover / Selecionar', 'bg-sky-500 shadow-[0_0_10px_rgba(14,165,233,1)]'); workspace.style.cursor = 'default'; }
                if(tool === 'delete') { this.updateStatus('Excluir Elemento', 'bg-rose-500 shadow-[0_0_10px_rgba(244,63,94,1)]'); workspace.style.cursor = 'crosshair'; PropertiesManager.close(); }
                if(tool === 'cable') { this.updateStatus('Conectar (Origem -> Destino)', 'bg-amber-400 shadow-[0_0_10px_rgba(245,158,11,1)] animate-pulse'); workspace.style.cursor = 'crosshair'; }
                if(tool === 'ping') { this.updateStatus('Enviar PDU (Origem -> Destino)', 'bg-purple-500 shadow-[0_0_10px_rgba(168,85,247,1)] animate-pulse'); workspace.style.cursor = 'crosshair'; }
            },
            updateStatus(text, dotClass = 'bg-sky-500 shadow-[0_0_10px_rgba(14,165,233,1)]') {
                document.getElementById('tool-status').innerText = text;
                document.getElementById('status-dot').className = `w-2 h-2 rounded-full mr-2 ${dotClass}`;
            }
        };

        const CatalogManager = {
            selectCategory(cat) {
                State.currentCategory = cat;
                document.querySelectorAll('.w-24 button').forEach(b => {
                    b.classList.remove('bg-white/10', 'shadow-[inset_0_0_15px_rgba(0,0,0,0.5)]', 'border', 'border-white/5');
                    const i = b.querySelector('i');
                    if(i) {
                        i.className = i.className.replace(/text-(rose|emerald|sky|purple)-500/g, 'text-slate-500');
                        i.classList.remove('drop-shadow-[0_0_8px_rgba(56,189,248,0.5)]', 'drop-shadow-[0_0_8px_rgba(244,63,94,0.5)]', 'drop-shadow-[0_0_8px_rgba(16,185,129,0.5)]');
                    }
                });
                
                const activeBtn = document.getElementById('cat-' + cat);
                if(activeBtn) {
                    activeBtn.classList.add('bg-white/10', 'shadow-[inset_0_0_15px_rgba(0,0,0,0.5)]', 'border', 'border-white/5');
                    const colorMap = { routers: 'rose', switches: 'emerald', end_devices: 'sky' };
                    const color = colorMap[cat] || 'sky';
                    const icon = activeBtn.querySelector('i');
                    icon.className = icon.className.replace('text-slate-500', `text-${color}-500`);
                    
                    if(color==='sky') icon.classList.add('drop-shadow-[0_0_8px_rgba(56,189,248,0.5)]');
                    if(color==='rose') icon.classList.add('drop-shadow-[0_0_8px_rgba(244,63,94,0.5)]');
                    if(color==='emerald') icon.classList.add('drop-shadow-[0_0_8px_rgba(16,185,129,0.5)]');
                }
                this.renderList();
            },
            renderList() {
                const list = document.getElementById('equipment-list');
                list.innerHTML = '';
                CATEGORIES[State.currentCategory].forEach(item => {
                    const btn = document.createElement('button');
                    btn.className = `equipment-item flex flex-col items-center justify-center w-24 h-[90px] bg-black/40 border border-white/5 rounded-xl hover:bg-white/10 hover:border-${item.color}-500/50 transition-all shrink-0 outline-none group shadow-lg`;
                    btn.innerHTML = `
                        <div class="w-10 h-10 mb-2 transition-transform duration-300 group-hover:-translate-y-1 flex items-center justify-center text-3xl opacity-80 group-hover:opacity-100 group-hover:scale-110 drop-shadow-lg">${ICONS[item.type]}</div>
                        <span class="text-[10px] font-bold text-slate-400 text-center leading-tight group-hover:text-white transition-colors tracking-wide">${item.label}</span>
                    `;
                    btn.onclick = () => {
                        if(State.selectedTool !== 'pointer') ToolManager.set('pointer');
                        State.itemToPlace = item;
                        document.querySelectorAll('.equipment-item').forEach(el => el.classList.remove('ring-2', `ring-${item.color}-500`, 'bg-white/10', `shadow-[0_0_15px_rgba(0,0,0,0)]`));
                        btn.classList.add('ring-2', `ring-${item.color}-500`, 'bg-white/10');
                        btn.style.boxShadow = `0 0 15px var(--tw-ring-color)`;
                        ToolManager.updateStatus(`Implantando ${item.label}...`, `animate-pulse bg-${item.color}-500 shadow-[0_0_15px_currentColor] text-${item.color}-500`);
                        document.getElementById('workspace').style.cursor = 'crosshair';
                    };
                    list.appendChild(btn);
                });
            }
        };

        const PropertiesManager = {
            open(dev) {
                State.activeDevice = dev;
                document.getElementById('prop-header-title').innerText = dev.name;
                document.getElementById('prop-header-mac').innerText = dev.interfaces[0].mac;
                document.getElementById('prop-small-icon').innerHTML = ICONS[dev.typeStr];
                document.getElementById('prop-name').value = dev.name;

                const gwCont = document.getElementById('prop-gateway-container'), intCont = document.getElementById('prop-interface-container'), ipMaskCont = document.getElementById('prop-ip-mask-container');
                gwCont.classList.add('hidden'); intCont.classList.add('hidden'); ipMaskCont.classList.remove('hidden');

                if (['pc', 'laptop', 'server'].includes(dev.typeStr)) {
                    gwCont.classList.remove('hidden');
                    document.getElementById('prop-gateway').value = dev.gateway || '';
                    document.getElementById('prop-ip').value = dev.interfaces[0].ip || '';
                    document.getElementById('prop-mask').value = dev.interfaces[0].mask || '';
                } else if (dev.typeStr === 'router') {
                    intCont.classList.remove('hidden');
                    const sel = document.getElementById('prop-interface-sel');
                    sel.innerHTML = dev.interfaces.map((intf, idx) => `<option value="${idx}">${intf.name} ${intf.connectedTo?'(UP)':'(DOWN)'}</option>`).join('');
                    this.loadInterface();
                } else if (['switch', 'cloud'].includes(dev.typeStr)) {
                    ipMaskCont.classList.add('hidden');
                }

                CLIManager.render();
                document.getElementById('properties-panel').classList.remove('translate-x-full');
            },
            close() {
                document.getElementById('properties-panel').classList.add('translate-x-full');
                State.activeDevice = null;
            },
            switchTab(tab) {
                const c = document.getElementById('tab-config'), cli = document.getElementById('tab-cli');
                const bc = document.getElementById('tab-btn-config'), bcli = document.getElementById('tab-btn-cli');
                if(tab === 'config') {
                    c.classList.remove('hidden'); cli.classList.replace('flex', 'hidden');
                    bc.classList.add('border-sky-500', 'text-sky-400'); bc.classList.remove('border-transparent', 'text-slate-400');
                    bcli.classList.remove('border-sky-500', 'text-sky-400'); bcli.classList.add('border-transparent', 'text-slate-400');
                } else {
                    c.classList.add('hidden'); cli.classList.replace('hidden', 'flex');
                    bcli.classList.add('border-sky-500', 'text-sky-400'); bcli.classList.remove('border-transparent', 'text-slate-400');
                    bc.classList.remove('border-sky-500', 'text-sky-400'); bc.classList.add('border-transparent', 'text-slate-400');
                    setTimeout(() => { 
                        document.getElementById('cli-input').focus(); 
                        document.getElementById('cli-output').scrollTop = document.getElementById('cli-output').scrollHeight; 
                    }, 50);
                }
            },
            loadInterface() {
                if(!State.activeDevice || State.activeDevice.typeStr !== 'router') return;
                const intf = State.activeDevice.interfaces[document.getElementById('prop-interface-sel').value];
                document.getElementById('prop-ip').value = intf.ip || '';
                document.getElementById('prop-mask').value = intf.mask || '';
                document.getElementById('prop-header-mac').innerText = intf.mac;
            },
            update(prop) {
                if(!State.activeDevice) return;
                const dev = State.activeDevice;
                
                if(prop === 'name') {
                    let newName = document.getElementById('prop-name').value.trim();
                    if(newName) {
                        dev.name = newName;
                        if(['router', 'switch'].includes(dev.typeStr)) dev.prompt = dev.prompt.replace(/^.*?[>#]/, newName + (dev.prompt.includes('#') ? '#' : '>'));
                        else dev.prompt = 'user@' + newName.toLowerCase() + ':~$ ';
                        document.getElementById('prop-header-title').innerText = newName;
                    }
                } 
                else if(prop === 'gateway') dev.gateway = document.getElementById('prop-gateway').value.trim();
                else if(prop === 'ip' || prop === 'mask') {
                    let val = document.getElementById('prop-' + prop).value.trim();
                    if(['pc', 'laptop', 'server'].includes(dev.typeStr)) dev.interfaces[0][prop] = val;
                    else if(dev.typeStr === 'router') dev.interfaces[document.getElementById('prop-interface-sel').value][prop] = val;
                    NetworkEngine.drawLinks();
                }
                NetworkEngine.updateDeviceDOM(dev);
                CLIManager.render();
            }
        };

        const CLIManager = {
            print(text) {
                if(!State.activeDevice) return;
                State.activeDevice.cliOutput.push(text);
                this.render();
            },
            render() {
                if(!State.activeDevice) return;
                const out = document.getElementById('cli-output');
                out.textContent = State.activeDevice.cliOutput.join('\n');
                document.getElementById('cli-prompt').innerText = State.activeDevice.prompt;
                requestAnimationFrame(() => out.scrollTop = out.scrollHeight);
            },
            handleInput(e) {
                if(!State.activeDevice) return;
                const buf = State.cliHistoryBuffer[State.activeDevice.id];
                const input = e.target;
                
                if(e.key === 'Tab') {
                    e.preventDefault();
                    let val = input.value.toLowerCase();
                    let match = CLI_COMMANDS.find(c => c.startsWith(val));
                    if(match) input.value = match + ' ';
                }
                else if(e.key === 'Enter') {
                    let cmd = input.value.trim();
                    input.value = '';
                    if(cmd) { buf.cmds.push(cmd); buf.index = buf.cmds.length; }
                    this.print(State.activeDevice.prompt + cmd);
                    this.processCommand(State.activeDevice, cmd);
                } 
                else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    if(buf.index > 0) { buf.index--; input.value = buf.cmds[buf.index]; }
                } 
                else if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    if(buf.index < buf.cmds.length - 1) { buf.index++; input.value = buf.cmds[buf.index]; }
                    else { buf.index = buf.cmds.length; input.value = ''; }
                }
            },
            processCommand(dev, cmd) {
                if(!cmd) return;
                let args = cmd.split(' ').filter(x=>x);
                let base = args[0].toLowerCase();
                let fullCmd = args.join(' ').toLowerCase();
                
                if (['pc', 'laptop', 'server'].includes(dev.typeStr)) {
                    if(base === 'ping') {
                        if(args.length < 2) return this.print("Usage: ping <ip_address>");
                        NetworkEngine.executePing(dev, args[1]);
                    } else if(base === 'traceroute' || base === 'tracert') {
                        if(args.length < 2) return this.print("Usage: traceroute <ip_address>");
                        NetworkEngine.executeTraceroute(dev, args[1]);
                    } else if (base === 'ipconfig' || base === 'ifconfig' || base === 'ip') {
                        let i = dev.interfaces[0];
                        this.print(`\neth0: flags=4163<UP,BROADCAST,RUNNING,MULTICAST>  mtu 1500\n        inet ${i.ip || '0.0.0.0'}  netmask ${i.mask || '0.0.0.0'}\n        ether ${i.mac}  txqueuelen 1000\n        Gateway: ${dev.gateway || '0.0.0.0'}\n`);
                    } else if (base === 'arp') {
                        this.print("\nAddress                  HWtype  HWaddress           Flags Mask            Iface\n192.168.1.1              ether   00:1a:2b:3c:4d:5e   C                     eth0\n");
                    } else if (base === 'clear') {
                        dev.cliOutput = []; this.render();
                    } else this.print(`bash: ${base}: command not found`);
                } 
                else if (['router', 'switch'].includes(dev.typeStr)) {
                    if (base === 'enable' || base === 'en') dev.prompt = dev.name + '#';
                    else if (base === 'disable') dev.prompt = dev.name + '>';
                    else if (fullCmd.startsWith('conf') || fullCmd === 'configure terminal') {
                        if(dev.prompt.includes('#')) dev.prompt = dev.name + '(config)#'; else this.print('% Incomplete command.');
                    } else if (base === 'exit') {
                        if(dev.prompt.includes('(config)')) dev.prompt = dev.name + '#'; else dev.prompt = dev.name + '>';
                    } else if (fullCmd.startsWith('show ip ro') || fullCmd === 'sh ip route') {
                        this.print("Codes: L - local, C - connected, S - static\nGateway of last resort is not set\n");
                        let found = false;
                        dev.interfaces.forEach(i => {
                            if(i.ip && i.mask) { this.print(`C    ${Utils.getNetworkStr(i.ip, i.mask)} is directly connected, ${i.name}`); found = true; }
                        });
                        if(!found) this.print("Routing table is empty.");
                    } else if (fullCmd.startsWith('show ip int b') || fullCmd === 'sh ip int brief') {
                        this.print(`Interface                  IP-Address      OK? Method Status                Protocol`);

        const NetworkLogger = {

                    <div class="border rounded-lg px-3 py-2 flex items-center justify-between shadow-md mb-2 ${color} backdrop-blur-md animate-slide-up">
                        <div class="flex flex-col gap-0.5">

        const NetworkEngine = {
            renderDevice(dev) {
                const el = document.createElement('div');
                el.className = 'device animate-pop-in';
                el.id = dev.id;
                el.style.left = dev.x + 'px'; el.style.top = dev.y + 'px';

                    <div class="device-icon-wrapper">${ICONS[dev.typeStr]}</div>

                // Impedir seleção de texto durante arraste
                el.addEventListener('mousedown', e => {

                        State.draggingDevice = dev;

                el.addEventListener('contextmenu', e => {
                    e.preventDefault();
                    e.stopPropagation();

                el.addEventListener('click', e => {
                    e.stopPropagation();

                            ToolManager.updateStatus(`Conectando ${dev.name}...`, 'bg-amber-500 animate-pulse');
                        } else {
                            if (State.cableSourceDevice.id !== dev.id) this.createLink(State.cableSourceDevice, dev);
                            document.getElementById(State.cableSourceDevice.id)?.classList.remove('cable-src');
                            State.cableSourceDevice = null;
                            document.getElementById('drawing-cable').classList.add('hidden');
                            ToolManager.set('pointer');

                    }
                    else if (State.selectedTool === 'ping') {
                        if (!State.pingSourceDevice) {
                            if(dev.isLayer3) {
                                State.pingSourceDevice = dev; el.classList.add('ping-src');
                                ToolManager.updateStatus(`Ping a partir de ${dev.name}...`, 'bg-purple-500 shadow-[0_0_10px_rgba(168,85,247,1)] animate-pulse');
                            } else {
                                Toast.show('Ping precisa iniciar em dispositivo Layer 3.', 'error');
                                ToolManager.set('pointer');
                            }
                        } else {
                            if (State.pingSourceDevice.id !== dev.id && dev.isLayer3) {
                                let targetIp = dev.interfaces.find(i => i.ip)?.ip;
                                if(!targetIp) {
                                    NetworkLogger.log(State.pingSourceDevice.name, dev.name, 'ICMP', 'Target Unconfigured');
                                    Toast.show('Destino não possui IP configurado.', 'warning');
                                } else {
                                    PropertiesManager.open(State.pingSourceDevice);
                                    PropertiesManager.switchTab('cli');
                                    this.executePing(State.pingSourceDevice, targetIp);
                                }
                            }
                            document.getElementById(State.pingSourceDevice.id)?.classList.remove('ping-src');
                            State.pingSourceDevice = null;
                            ToolManager.set('pointer');
                        }
                    }
                });
                document.getElementById('devices-layer').appendChild(el);
                setTimeout(() => el.classList.remove('animate-pop-in'), 200);
            },
            updateDeviceDOM(dev) {
                const el = document.getElementById(dev.id);
                if(!el) return;
                el.querySelector('.device-label').innerText = dev.name;
                let primaryIp = dev.interfaces.find(i => i.ip)?.ip || '';
                let ipLabel = el.querySelector('.device-ip-label');
                if(primaryIp) {
                    if(ipLabel) ipLabel.innerText = primaryIp;
                    else {
                        const nl = document.createElement('div'); nl.className = 'device-ip-label'; nl.innerText = primaryIp;
                        el.appendChild(nl);
                    }
                } else if (ipLabel) ipLabel.remove();
            },
            createLink(dev1, dev2) {
                if(State.links.some(l => (l.sourceId === dev1.id && l.targetId === dev2.id) || (l.sourceId === dev2.id && l.targetId === dev1.id))) return;
                const idx1 = dev1.interfaces.findIndex(i => !i.connectedTo);
                const idx2 = dev2.interfaces.findIndex(i => !i.connectedTo);
                if(idx1 === -1 || idx2 === -1) return Toast.show('Portas físicas insuficientes.', 'error');

                const linkId = 'link_' + Date.now();
                dev1.interfaces[idx1].connectedTo = linkId; dev2.interfaces[idx2].connectedTo = linkId;
                State.links.push({ id: linkId, sourceId: dev1.id, srcIntf: idx1, targetId: dev2.id, tgtIntf: idx2 });
                this.drawLinks();
            },
            drawLinks() {
                const layer = document.getElementById('cables-layer');
                layer.innerHTML = '';
                State.links.forEach(l => {
                    const s = State.devices.find(d => d.id === l.sourceId);
                    const t = State.devices.find(d => d.id === l.targetId);
                    if(!s || !t) return;
                    
                    const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                    group.classList.add('link-group');
                    group.id = `group_${l.id}`;

                    const pathD = Utils.calculateGravityCurve(s.x, s.y, t.x, t.y);

                    const line = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    line.setAttribute('d', pathD); line.classList.add('link-line'); line.id = `path_${l.id}`;

                    const hitArea = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    hitArea.setAttribute('d', pathD); hitArea.classList.add('link-hit-area');
                    
                    group.addEventListener('click', e => {
                        e.stopPropagation(); ContextMenu.hide();
                        if(State.selectedTool === 'delete') {
                            s.interfaces[l.srcIntf].connectedTo = null; t.interfaces[l.tgtIntf].connectedTo = null;
                            State.links = State.links.filter(lk => lk.id !== l.id);
                            this.drawLinks(); ToolManager.set('pointer');
                        }
                    });

                    group.appendChild(line); group.appendChild(hitArea);

                    const sState = (s.typeStr === 'router' && !s.interfaces[l.srcIntf].ip) ? 'down' : '';
                    const tState = (t.typeStr === 'router' && !t.interfaces[l.tgtIntf].ip) ? 'down' : '';

                    const px1 = s.x + (t.x - s.x) * 0.15, py1 = s.y + (t.y - s.y) * 0.15;
                    const px2 = t.x + (s.x - t.x) * 0.15, py2 = t.y + (s.y - t.y) * 0.15;

                    const dotS = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    dotS.setAttribute('cx', px1); dotS.setAttribute('cy', py1); dotS.setAttribute('r', 4); dotS.setAttribute('class', `port-light ${sState}`);
                    const dotT = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    dotT.setAttribute('cx', px2); dotT.setAttribute('cy', py2); dotT.setAttribute('r', 4); dotT.setAttribute('class', `port-light ${tState}`);

                    group.appendChild(dotS); group.appendChild(dotT);
                    layer.appendChild(group);
                });
            },
            deleteDevice(dev) {
                if(State.activeDevice && State.activeDevice.id === dev.id) PropertiesManager.close();
                const el = document.getElementById(dev.id);
                if(el) { el.style.transform = 'scale(0)'; setTimeout(() => el.remove(), 200); }
                State.devices = State.devices.filter(d => d.id !== dev.id);
                State.links = State.links.filter(l => {
                    if(l.sourceId === dev.id || l.targetId === dev.id) {
                        const survivor = State.devices.find(d => d.id === (l.sourceId === dev.id ? l.targetId : l.sourceId));
                        if(survivor) survivor.interfaces[l.sourceId === dev.id ? l.tgtIntf : l.srcIntf].connectedTo = null;
                        return false;
                    }
                    return true;
                });
                this.drawLinks(); ToolManager.set('pointer');
            },
            getPhysicalNeighbors(deviceId) {
                let n = [];
                State.links.forEach(l => {
                    if(l.sourceId === deviceId) n.push(State.devices.find(d=>d.id===l.targetId));
                    if(l.targetId === deviceId) n.push(State.devices.find(d=>d.id===l.sourceId));
                });
                return n.filter(Boolean);
            },
            getBroadcastDomain(startDev) {
                let q = [startDev], visited = new Set([startDev.id]), domain = [];
                while(q.length > 0) {
                    let curr = q.shift(); domain.push(curr);
                    if (curr.typeStr === 'switch' || curr.id === startDev.id) {
                        this.getPhysicalNeighbors(curr.id).forEach(n => { if(!visited.has(n.id)) { visited.add(n.id); q.push(n); } });
                    }
                }
                return domain;
            },
            findLayer2Path(startDev, targetDev) {
                let q = [{ dev: startDev, path: [startDev] }], visited = new Set([startDev.id]);
                while(q.length > 0) {
                    let {dev, path} = q.shift();
                    if(dev.id === targetDev.id) return path;
                    if (dev.typeStr === 'switch' || dev.id === startDev.id) {
                        this.getPhysicalNeighbors(dev.id).forEach(n => {
                            if(!visited.has(n.id)) { visited.add(n.id); q.push({ dev: n, path: [...path, n] }); }
                        });
                    }
                }
                return null;
            },
            findTargetDeviceByIp(ip) {
                return State.devices.find(d => {
                    if(['pc','laptop','server'].includes(d.typeStr) && d.interfaces[0].ip === ip) return true;
                    if(d.typeStr === 'router' && d.interfaces.some(i => i.ip === ip)) return true;
                    if(d.typeStr === 'cloud' && d.interfaces[0].ip === ip) return true;
                    return false;
                });
            },
            traceRouteLogic(srcDevice, targetIp) {
                let srcIp = srcDevice.interfaces[0].ip, srcMask = srcDevice.interfaces[0].mask;
                if (Utils.isSameSubnet(srcIp, srcMask, targetIp, srcMask)) {
                    let targetDev = this.findTargetDeviceByIp(targetIp);
                    if(!targetDev) return { success: false, error: "Destination host unreachable.", hops: [] };
                    let path = this.findLayer2Path(srcDevice, targetDev);
                    if(path) return { success: true, path: path, hops: [targetDev] };
                    else return { success: false, error: "Request timed out.", hops: [] };
                } else {
                    let gwIp = srcDevice.gateway;
                    if(!gwIp) return { success: false, error: "Network is unreachable.", hops: [] };
                    let bd = this.getBroadcastDomain(srcDevice);
                    let router = bd.find(d => d.typeStr === 'router' && d.interfaces.some(i => i.ip === gwIp));
                    if(!router) return { success: false, error: `Reply from ${srcIp}: Destination host unreachable.`, hops: [] };
                    let targetDev = this.findTargetDeviceByIp(targetIp);
                    if(!targetDev) return { success: false, error: `Reply from ${gwIp}: Destination net unreachable.`, hops: [router] };
                    let path2 = this.findLayer2Path(router, targetDev);
                    if(!path2) return { success: false, error: "Request timed out.", hops: [router] };
                    let path1 = this.findLayer2Path(srcDevice, router);
                    return { success: true, path: path1.concat(path2.slice(1)), hops: [router, targetDev] };
                }
            },
            async executePing(source, targetIp) {
                CLIManager.print(`\nPING ${targetIp} (${targetIp}) 56(84) bytes of data.`);
                if(!source.interfaces[0].ip) {
                    CLIManager.print("connect: Network is unreachable");
                    NetworkLogger.log(source.name, targetIp, 'ICMP', 'Failed');
                    return;
                }

                let result = this.traceRouteLogic(source, targetIp);
                let successes = 0;

                for(let i=0; i<4; i++) {
                    await new Promise(r => setTimeout(r, 600));
                    if(result.success) {
                        await this.animatePacketSVG(result.path); // Aguarda a animação ir e voltar
                        let time = Math.floor(Math.random()*15)+1;
                        CLIManager.print(`64 bytes from ${targetIp}: icmp_seq=${i+1} ttl=64 time=${time} ms`);
                        successes++;
                        this.flashDevice(result.path[result.path.length-1].id, 'rgba(16, 185, 129, 1)');
                        if(i===0) NetworkLogger.log(source.name, targetIp, 'ICMP Echo', 'Success');
                    } else {
                        await this.animatePacketSVG(result.path || [source], true);
                        CLIManager.print(`From ${result.error.includes('Reply') ? result.error.split(' ')[2] : source.interfaces[0].ip} icmp_seq=${i+1} ${result.error}`);
                        if(i===0) NetworkLogger.log(source.name, targetIp, 'ICMP Drop', 'Dropped');
                    }
                }
                CLIManager.print(`\n--- ${targetIp} ping statistics ---`);
                CLIManager.print(`4 packets transmitted, ${successes} received, ${(4-successes)*25}% packet loss, time ${Math.floor(Math.random()*1500)+500}ms\n`);
            },
            async executeTraceroute(source, targetIp) {
                CLIManager.print(`\ntraceroute to ${targetIp}, 30 hops max, 60 byte packets`);
                let result = this.traceRouteLogic(source, targetIp);
                if(result.hops && result.hops.length > 0) {
                    for(let i=0; i<result.hops.length; i++) {
                        await new Promise(r => setTimeout(r, 800));
                        let hop = result.hops[i];
                        let ipToLog = hop.id === this.findTargetDeviceByIp(targetIp)?.id ? targetIp : hop.interfaces.find(intf => intf.ip)?.ip;
                        CLIManager.print(` ${i+1}  ${ipToLog} (${ipToLog})  ${Math.floor(Math.random()*10)+1} ms  ${Math.floor(Math.random()*10)+1} ms`);
                    }
                    if(!result.success) {
                        await new Promise(r => setTimeout(r, 800));
                        CLIManager.print(` ${result.hops.length + 1}  * * *`);
                    }
                } else {
                    await new Promise(r => setTimeout(r, 800));
                    CLIManager.print(` 1  * * *`);
                }
                CLIManager.print("");
            },
            flashDevice(id, color) {
                const el = document.getElementById(id);
                if(el) {
                    const icon = el.querySelector('.device-icon-wrapper');
                    icon.style.boxShadow = `0 0 35px ${color}, inset 0 0 20px ${color}`;
                    icon.style.borderColor = color;
                    setTimeout(() => { icon.style.boxShadow = ''; icon.style.borderColor = ''; }, 500);
                }
            },
            
            // Nova animação realista usando propriedades SVG e getPointAtLength
            animatePacketSVG(pathNodes, isError = false) {
                return new Promise(resolve => {
                    if(!pathNodes || pathNodes.length < 1) { resolve(); return; }
                    
                    const pktLayer = document.getElementById('packets-layer');
                    const pkt = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    pkt.setAttribute('r', 7);
                    pkt.setAttribute('class', `svg-packet ${isError ? 'error' : ''}`);
                    pktLayer.appendChild(pkt);

                    if(pathNodes.length === 1) {
                        pkt.setAttribute('cx', pathNodes[0].x); pkt.setAttribute('cy', pathNodes[0].y);
                        setTimeout(() => { pkt.remove(); resolve(); }, 400);
                        return;
                    }

                    let segments = [];
                    for(let i=0; i<pathNodes.length-1; i++) {
                        let n1 = pathNodes[i], n2 = pathNodes[i+1];
                        let link = State.links.find(l => (l.sourceId === n1.id && l.targetId === n2.id) || (l.sourceId === n2.id && l.targetId === n1.id));
                        if(link) {
                            let pathEl = document.getElementById(`path_${link.id}`);
                            // Determinar a direção do path desenhado em relação ao nosso percurso
                            let isReverse = link.sourceId !== n1.id;
                            segments.push({ pathEl, isReverse, length: pathEl.getTotalLength(), linkId: link.id });
                        }
                    }

                    const durationPerLink = 400; // ms
                    
                    const animateFlow = (segs, isReturn) => {
                        return new Promise(res => {
                            if(segs.length === 0) { res(); return; }
                            if(isReturn) pkt.setAttribute('class', 'svg-packet return');

                            let currentSegIdx = 0;
                            let start = null;

                            const step = (timestamp) => {
                                if(!start) start = timestamp;
                                let progress = (timestamp - start) / durationPerLink;
                                
                                if(progress > 1) {
                                    document.getElementById(`group_${segs[currentSegIdx].linkId}`)?.classList.remove('active-flow');
                                    currentSegIdx++;
                                    if(currentSegIdx >= segs.length) { res(); return; }
                                    start = timestamp;
                                    progress = 0;
                                }

                                let seg = segs[currentSegIdx];
                                document.getElementById(`group_${seg.linkId}`)?.classList.add('active-flow');

                                let percent = seg.isReverse ? (1 - progress) : progress;
                                let point = seg.pathEl.getPointAtLength(percent * seg.length);
                                
                                pkt.setAttribute('cx', point.x);
                                pkt.setAttribute('cy', point.y);

                                requestAnimationFrame(step);
                            };
                            requestAnimationFrame(step);
                        });
                    };

                    // Ida e Volta
                    animateFlow(segments, false).then(() => {
                        if(isError) { pkt.remove(); resolve(); }
                        else {
                            // Inverte os segmentos para a volta
                            let returnSegments = segments.slice().reverse().map(s => ({...s, isReverse: !s.isReverse}));
                            animateFlow(returnSegments, true).then(() => {
                                pkt.remove(); resolve();
                            });
                        }
                    });
                });
            }
        };

                Toast.show('Topologia criptografada e armazenada no cache local.', 'success');
            },
            load() {
                const dataStr = localStorage.getItem('wpt_switchlab_ultra');
                if(!dataStr) return Toast.show('Nenhuma topologia em cache encontrada.', 'warning');
                
                showModal('Carregar Matriz', 'O carregamento substituirá a configuração atual. Prosseguir?', 'confirm', () => {
                    document.getElementById('devices-layer').innerHTML = ''; 
                    document.getElementById('cables-layer').innerHTML = ''; 
                    document.getElementById('packets-layer').innerHTML = '';
                    State.devices = []; State.links = []; PropertiesManager.close(); NetworkLogger.clear();
                    
                    try {
                        const data = JSON.parse(dataStr);
                        State.deviceCounter = data.deviceCounter;
                        
                        data.devices.forEach(d => {
                            let newDev;
                            if(['pc','laptop','server'].includes(d.typeStr)) newDev = new EndDevice(d.typeStr, 'x', d.x, d.y);
                            else if(d.typeStr === 'router') newDev = new Router(d.typeStr, 'x', d.x, d.y);
                            else if(d.typeStr === 'switch') newDev = new Switch(d.typeStr, 'x', d.x, d.y);
                            else if(d.typeStr === 'cloud') newDev = new Cloud(d.typeStr, 'x', d.x, d.y);
                            
                            Object.assign(newDev, d);
                            State.cliHistoryBuffer[newDev.id] = { cmds: [], index: -1 };
                            State.devices.push(newDev); NetworkEngine.renderDevice(newDev); NetworkEngine.updateDeviceDOM(newDev);
                        });
                        data.links.forEach(l => State.links.push(l)); 
                        NetworkEngine.drawLinks();
                        Toast.show('Topologia neural restaurada com sucesso.', 'success');

                        Toast.show('Erro Crítico: Falha ao decodificar matriz salva.', 'error');

        window.addEventListener('keydown', e => {
            if(e.target.tagName === 'INPUT' && e.target.id !== 'cli-input') return;
            if(e.target.id === 'cli-input') return CLIManager.handleInput(e);
            
            if(e.key === 'Escape') { ToolManager.set('pointer'); PropertiesManager.close(); ContextMenu.hide(); }
            if((e.key === 'Delete' || e.key === 'Backspace') && e.target.tagName !== 'INPUT') ToolManager.set('delete');
            if(e.key.toLowerCase() === 'c' && document.activeElement.tagName !== 'INPUT') ToolManager.set('cable');
            if(e.key.toLowerCase() === 'p' && document.activeElement.tagName !== 'INPUT') ToolManager.set('ping');
        });

        document.getElementById('workspace').addEventListener('click', e => {
            ContextMenu.hide();
            if(e.target.closest('.device') || e.target.closest('.link-group')) return;

            if (State.itemToPlace) {
                const rect = document.getElementById('workspace').getBoundingClientRect();
                const x = e.clientX - rect.left; const y = e.clientY - rect.top;
                
                let newDev;
                const { type, name } = State.itemToPlace;
                if(['pc', 'laptop', 'server'].includes(type)) newDev = new EndDevice(type, name, x, y);
                else if (type === 'router') newDev = new Router(type, name, x, y);
                else if (type === 'switch') newDev = new Switch(type, name, x, y);
                else if (type === 'cloud') newDev = new Cloud(type, name, x, y);

                if(newDev) { State.devices.push(newDev); NetworkEngine.renderDevice(newDev); }
                ToolManager.set('pointer');
            } 
            else if (State.selectedTool === 'pointer') {
                PropertiesManager.close();
                State.devices.forEach(d => document.getElementById(d.id)?.classList.remove('selected'));
            } 
            else if (State.selectedTool === 'cable' && State.cableSourceDevice) {
                document.getElementById(State.cableSourceDevice.id)?.classList.remove('cable-src');
                State.cableSourceDevice = null;
                document.getElementById('drawing-cable').classList.add('hidden');
            } 
            else if (State.selectedTool === 'ping' && State.pingSourceDevice) {
                State.pingSourceDevice = null;
                State.devices.forEach(d => document.getElementById(d.id)?.classList.remove('ping-src'));
            }
        });

        document.getElementById('workspace').addEventListener('mousemove', e => {
            const rect = document.getElementById('workspace').getBoundingClientRect();
            const mx = e.clientX - rect.left; const my = e.clientY - rect.top;

            if (State.draggingDevice && State.selectedTool === 'pointer') {
                State.draggingDevice.x = Math.max(40, Math.min(mx, rect.width - 40));
                State.draggingDevice.y = Math.max(40, Math.min(my, rect.height - 40));
                const el = document.getElementById(State.draggingDevice.id);
                el.style.left = State.draggingDevice.x + 'px'; el.style.top = State.draggingDevice.y + 'px';
                NetworkEngine.drawLinks();
            }

            if (State.selectedTool === 'cable' && State.cableSourceDevice) {
                document.getElementById('drawing-line').setAttribute('d', Utils.calculateGravityCurve(State.cableSourceDevice.x, State.cableSourceDevice.y, mx, my));
            }
        });

        window.addEventListener('mouseup', () => { 
            State.draggingDevice = null; 
            document.body.style.userSelect = 'auto'; // Restaura seleção de texto
        });

        // --- INICIALIZAÇÃO E DEMONSTRAÇÃO ---
        window.onload = () => {
            CatalogManager.selectCategory('routers');
            
            let r1 = new Router('router', 'R1-Core', window.innerWidth/2, window.innerHeight * 0.25); 
            r1.interfaces[0].ip = '10.0.0.1'; r1.interfaces[0].mask = '255.255.255.0'; 
            r1.interfaces[1].ip = '192.168.1.1'; r1.interfaces[1].mask = '255.255.255.0';
            
            let sw1 = new Switch('switch', 'SW-Dist-A', window.innerWidth/2 + 200, window.innerHeight * 0.45);
            
            let pc1 = new EndDevice('pc', 'Terminal-01', window.innerWidth/2 + 80, window.innerHeight * 0.65); 
            pc1.interfaces[0].ip = '192.168.1.10'; pc1.gateway = '192.168.1.1';
            
            let srv = new EndDevice('server', 'DataCenter-01', window.innerWidth/2 + 320, window.innerHeight * 0.65); 
            srv.interfaces[0].ip = '192.168.1.100'; srv.gateway = '192.168.1.1';

            let cld = new Cloud('cloud', 'Internet', window.innerWidth/2 - 200, window.innerHeight * 0.25);

            [r1, sw1, pc1, srv, cld].forEach(d => { State.devices.push(d); NetworkEngine.renderDevice(d); NetworkEngine.updateDeviceDOM(d); });
            
            NetworkEngine.createLink(cld, r1);
            NetworkEngine.createLink(r1, sw1);
            NetworkEngine.createLink(sw1, pc1);
            NetworkEngine.createLink(sw1, srv);
        };
    </script>
</body>
