 <!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Web Packet Tracer Pro | SwitchLab Ultra</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Phosphor Icons for premium iconography -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        cyber: {
                            bg: '#050507',
                            surface: '#0a0a0f',
                            panel: 'rgba(15, 15, 25, 0.75)',
                            border: 'rgba(56, 189, 248, 0.15)',
                            primary: '#0ea5e9',
                            primaryGlow: 'rgba(14, 165, 233, 0.5)',
                            accent: '#8b5cf6',
                            accentGlow: 'rgba(139, 92, 246, 0.5)',
                            success: '#10b981',
                            danger: '#f43f5e',
                            warning: '#f59e0b'
                        }
                    },
                    animation: {
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'data-flow': 'dash 1s linear infinite',
                        'crt-flicker': 'flicker 0.15s infinite',
                    },
                    keyframes: {
                        dash: {
                            'to': { strokeDashoffset: '-24' }
                        },
                        flicker: {
                            '0%': { opacity: '0.95' },
                            '100%': { opacity: '1' }
                        }
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --grid-color: rgba(56, 189, 248, 0.05);
            --grid-size: 30px;
        }

        body { 
            margin: 0; 
            overflow: hidden; 
            user-select: none; 
            background-color: #050507; 
            color: #e2e8f0;
        }

        /* Premium Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.2); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(56, 189, 248, 0.5); }
        .custom-scrollbar::-webkit-scrollbar-thumb { border-color: transparent; background-clip: padding-box; }

        .glass-panel {
            background: var(--bg, rgba(15, 15, 25, 0.65));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        .neon-border {
            border: 1px solid rgba(14, 165, 233, 0.3);
            box-shadow: inset 0 0 10px rgba(14, 165, 233, 0.1), 0 0 10px rgba(14, 165, 233, 0.1);
        }

        #workspace {
            background-color: #050507;
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: var(--grid-size) var(--grid-size);
            background-position: -1px -1px;
            cursor: crosshair;
        }

        .device {
            position: absolute;
            width: 80px;
            height: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transform: translate(-50%, -50%);
            z-index: 20;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .device-icon-wrapper {
            width: 56px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(15, 15, 25, 0.8);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            backdrop-filter: blur(4px);
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .device:hover .device-icon-wrapper {
            transform: translateY(-4px) scale(1.05);
            border-color: rgba(56, 189, 248, 0.4);
            box-shadow: 0 8px 25px rgba(14, 165, 233, 0.2);
        }

        .device i { font-size: 32px; transition: color 0.2s; }
        
        /* Device States */
        .device.selected .device-icon-wrapper {
            border-color: #0ea5e9;
            box-shadow: 0 0 20px rgba(14, 165, 233, 0.4), inset 0 0 10px rgba(14, 165, 233, 0.2);
        }
        .device.ping-src .device-icon-wrapper {
            border-color: #8b5cf6;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.4), inset 0 0 10px rgba(139, 92, 246, 0.2);
        }
        .device.cable-src .device-icon-wrapper {
            border-color: #f59e0b;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.4), inset 0 0 10px rgba(245, 158, 11, 0.2);
        }

        .device:active { transform: translate(-50%, -50%) scale(0.95); cursor: grabbing !important; }

        .device-label {
            font-size: 11px;
            font-weight: 600;
            margin-top: 10px;
            background: rgba(10, 10, 15, 0.9);
            padding: 3px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #cbd5e1;
            pointer-events: none;
            white-space: nowrap;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .device-ip-label {
            font-size: 10px;
            color: #38bdf8;
            font-family: 'JetBrains Mono', monospace;
            background: rgba(14, 165, 233, 0.1);
            padding: 2px 8px;
            border-radius: 6px;
            pointer-events: none;
            margin-top: 4px;
            border: 1px solid rgba(14, 165, 233, 0.2);
        }

        .link-group { cursor: pointer; }
        .link-hit-area {
            stroke: transparent;
            stroke-width: 20;
            fill: none;
            pointer-events: stroke;
        }
        .link-line {
            stroke: rgba(148, 163, 184, 0.4);
            stroke-width: 3;
            fill: none;
            transition: stroke 0.3s, stroke-width 0.2s, filter 0.3s;
            pointer-events: none;
        }
        .link-group:hover .link-line {
            stroke: #f43f5e;
            stroke-width: 4;
            filter: drop-shadow(0 0 8px rgba(244, 63, 94, 0.6));
        }
        
        .port-light {
            fill: #10b981;
            stroke: #050507;
            stroke-width: 2;
            filter: drop-shadow(0 0 6px rgba(16, 185, 129, 0.8));
            transition: fill 0.3s, filter 0.3s;
        }
        .port-light.down {
            fill: #f43f5e;
            filter: drop-shadow(0 0 6px rgba(244, 63, 94, 0.8));
        }

        .port-label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 9px;
            fill: #94a3b8;
            pointer-events: none;
            text-anchor: middle;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.8));
        }

        #drawing-line {
            stroke: #f59e0b;
            stroke-width: 3;
            stroke-dasharray: 6,6;
            fill: none;
            animation: dash 0.5s linear infinite;
            filter: drop-shadow(0 0 8px rgba(245, 158, 11, 0.6));
        }

        .packet {
            position: absolute;
            width: 12px;
            height: 12px;
            background-color: #8b5cf6;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 30;
            box-shadow: 0 0 15px #8b5cf6, 0 0 30px #8b5cf6;
            transition: left 0.4s linear, top 0.4s linear, background-color 0.2s, box-shadow 0.2s;
            pointer-events: none;
        }
        .packet.return {
            background-color: #10b981;
            box-shadow: 0 0 15px #10b981, 0 0 30px #10b981;
        }
        .packet.error {
            background-color: #f43f5e;
            box-shadow: 0 0 15px #f43f5e, 0 0 30px #f43f5e;
        }

        .tool-active {
            background-color: rgba(14, 165, 233, 0.1) !important;
            color: #0ea5e9 !important;
            border-color: rgba(14, 165, 233, 0.3) !important;
            box-shadow: inset 0 0 10px rgba(14, 165, 233, 0.1);
        }

        .cli-container {
            background-color: #050507;
            color: #4ade80;
            font-family: 'JetBrains Mono', monospace;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.9);
            position: relative;
        }
        /* CRT Scanline Effect */
        .cli-container::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        .cli-input {
            background: transparent;
            border: none;
            outline: none;
            color: #f8fafc;
            flex: 1;
            width: 100%;
            caret-color: #4ade80;
        }
        
        .input-glow:focus {
            box-shadow: 0 0 0 1px #0ea5e9, 0 0 10px rgba(14, 165, 233, 0.2);
            border-color: transparent;
        }
    </style>
</head>
<body class="flex flex-col h-screen text-slate-200 font-sans antialiased selection:bg-sky-500/30 selection:text-sky-200">

    <div id="custom-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-[100] hidden flex items-center justify-center opacity-0 transition-opacity duration-300" onclick="if(event.target===this) closeModal()">
        <div class="bg-cyber-surface border border-white/10 rounded-2xl shadow-2xl w-[420px] overflow-hidden transform scale-95 transition-transform duration-300 neon-border" id="custom-modal-content">
            <div class="px-6 py-4 border-b border-white/5 flex justify-between items-center bg-white/5">
                <h3 class="text-lg font-semibold text-white flex items-center gap-2" id="modal-title">Notice</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white transition rounded-md p-1 hover:bg-white/10">
                    <i class="ph ph-x text-lg"></i>
                </button>
            </div>
            <div class="px-6 py-6 text-slate-300 text-sm leading-relaxed" id="modal-message">
                Message content.
            </div>
            <div class="px-6 py-4 bg-black/40 border-t border-white/5 flex justify-end gap-3" id="modal-actions">
                <!-- Injected via JS -->
            </div>
        </div>
    </div>

    <header class="h-14 glass-panel flex items-center justify-between px-6 z-50 shrink-0 border-b border-white/5">
        <div class="flex items-center space-x-6">
            <div class="flex items-center space-x-3 group cursor-default">
                <div class="bg-gradient-to-br from-sky-400 to-blue-600 p-1.5 rounded-lg shadow-[0_0_15px_rgba(14,165,233,0.4)]">
                    <i class="ph ph-activity text-white text-xl"></i>
                </div>
                <span class="font-bold text-lg tracking-tight text-white">Switch<span class="text-sky-400">Lab</span> <span class="font-normal text-xs text-sky-400/60 ml-1 border border-sky-400/30 px-1.5 py-0.5 rounded">ULTRA</span></span>
            </div>
            <div class="h-5 w-px bg-white/10"></div>
            <div id="project-name" class="text-sm font-medium text-slate-400 hover:text-white transition-colors cursor-pointer flex items-center gap-2 px-2 py-1 rounded hover:bg-white/5">
                Core Network Alpha <i class="ph ph-caret-down text-xs"></i>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <button onclick="saveTopology()" class="text-slate-300 hover:text-white bg-white/5 hover:bg-white/10 border border-white/10 px-3 py-1.5 rounded-md text-sm font-medium flex items-center gap-2 transition-all">
                <i class="ph ph-floppy-disk text-lg"></i> Save
            </button>
            <button onclick="loadTopology()" class="text-slate-300 hover:text-white bg-white/5 hover:bg-white/10 border border-white/10 px-3 py-1.5 rounded-md text-sm font-medium flex items-center gap-2 transition-all">
                <i class="ph ph-folder-open text-lg"></i> Load
            </button>
            <div class="w-px h-5 bg-white/10 mx-1"></div>
            <button onclick="promptClearWorkspace()" class="text-rose-400 hover:text-rose-300 bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/30 px-3 py-1.5 rounded-md text-sm font-medium transition-all">
                Clear Matrix
            </button>
        </div>
    </header>

    <div class="absolute top-20 left-1/2 transform -translate-x-1/2 glass-panel rounded-full px-2 py-2 flex items-center gap-1 z-40 shadow-2xl border-white/10">
        <button onclick="setTool('pointer')" id="tool-pointer" class="tool-btn tool-active p-2 rounded-full transition text-slate-400 hover:text-white border border-transparent" title="Select / Move / Configure (Esc)">
            <i class="ph ph-cursor text-xl"></i>
        </button>
        <button onclick="setTool('cable')" id="tool-cable" class="tool-btn p-2 rounded-full transition text-slate-400 hover:text-amber-400 border border-transparent" title="Connect Cable (C)">
            <i class="ph ph-plug text-xl"></i>
        </button>
        <button onclick="setTool('ping')" id="tool-ping" class="tool-btn p-2 rounded-full transition text-slate-400 hover:text-purple-400 border border-transparent" title="Send ICMP PDU (P)">
            <i class="ph ph-envelope-simple-run text-xl"></i>
        </button>
        <div class="w-px h-6 bg-white/10 mx-1"></div>
        <button onclick="setTool('delete')" id="tool-delete" class="tool-btn p-2 rounded-full transition text-slate-400 hover:text-rose-400 border border-transparent" title="Delete Object (Del)">
            <i class="ph ph-trash text-xl"></i>
        </button>
    </div>

    <div class="absolute top-20 left-6 z-40 pointer-events-none">
        <div class="glass-panel px-3 py-2 rounded-lg flex items-center shadow-lg border-white/10">
            <div class="w-2 h-2 rounded-full bg-sky-500 mr-2 shadow-[0_0_8px_rgba(14,165,233,0.8)]" id="status-dot"></div>
            <span id="tool-status" class="text-[10px] font-semibold text-slate-300 uppercase tracking-widest font-mono">Select Mode</span>
        </div>
    </div>

    <div class="flex flex-1 overflow-hidden relative">
        <main id="workspace" class="flex-1 relative overflow-hidden shadow-inner">
            <!-- SVG Cables -->
            <svg id="cables-layer" class="absolute top-0 left-0 w-full h-full z-10"></svg>
            <svg id="drawing-cable" class="absolute top-0 left-0 w-full h-full pointer-events-none z-10 hidden">
                <path id="drawing-line" d="" />
            </svg>
            <!-- HTML Devices -->
            <div id="devices-layer" class="absolute top-0 left-0 w-full h-full pointer-events-none z-20"></div>
            <!-- SVG Packets -->
            <div id="packets-layer" class="absolute top-0 left-0 w-full h-full pointer-events-none z-30"></div>
        </main>

        <aside id="properties-panel" class="w-[400px] glass-panel border-l border-t-0 border-b-0 border-white/10 flex flex-col shadow-2xl z-40 transition-transform duration-300 ease-[cubic-bezier(0.16,1,0.3,1)] transform translate-x-full absolute right-0 top-0 h-full bg-cyber-surface/90">
            
            <!-- Header -->
            <div class="h-16 flex items-center justify-between px-6 shrink-0 border-b border-white/5 bg-black/20">
                <div class="flex items-center gap-3">
                    <div id="prop-small-icon" class="text-sky-400 w-8 h-8 flex items-center justify-center bg-sky-400/10 rounded-lg border border-sky-400/20"></div>
                    <div>
                        <span class="font-bold text-base tracking-wide text-white block leading-tight" id="prop-header-title">Device</span>
                        <span class="text-[10px] font-mono text-slate-400" id="prop-header-mac">00:00:00:00:00:00</span>
                    </div>
                </div>
                <button onclick="closeProperties()" class="text-slate-400 hover:text-white transition rounded-md p-1.5 hover:bg-white/10">
                    <i class="ph ph-x text-lg"></i>
                </button>
            </div>
            
            <!-- Tabs -->
            <div class="flex border-b border-white/5 text-xs font-semibold text-slate-400 shrink-0 px-2 pt-2 bg-black/20 uppercase tracking-wider">
                <button class="flex-1 py-3 hover:text-white border-b-2 border-sky-500 text-sky-400 transition outline-none" id="tab-btn-config" onclick="switchTab('config')">Configuration</button>
                <button class="flex-1 py-3 hover:text-white border-b-2 border-transparent transition outline-none" id="tab-btn-cli" onclick="switchTab('cli')">Terminal CLI</button>
            </div>

            <!-- Config Tab -->
            <div id="tab-config" class="p-6 flex-1 overflow-y-auto bg-transparent custom-scrollbar">
                <div class="space-y-6">
                    <!-- General -->
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">Hostname</label>
                        <input type="text" id="prop-name" class="w-full bg-black/50 border border-white/10 text-white rounded-lg px-3 py-2.5 text-sm outline-none input-glow transition" onchange="updateDeviceProp('name')">
                    </div>
                    
                    <div id="prop-gateway-container">
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">Default Gateway</label>
                        <input type="text" id="prop-gateway" class="w-full bg-black/50 border border-white/10 text-slate-300 rounded-lg px-3 py-2.5 text-sm outline-none input-glow transition font-mono" placeholder="0.0.0.0" onchange="updateDeviceProp('gateway')">
                    </div>

                    <div class="w-full h-px bg-white/5 my-4"></div>

                    <!-- Interface -->
                    <div id="prop-interface-container">
                        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2 flex justify-between items-center">
                            Network Interface
                            <span class="text-[9px] text-sky-400 flex items-center gap-1"><i class="ph-fill ph-circle text-[8px]"></i> Link Up</span>
                        </label>
                        <select id="prop-interface-sel" class="w-full bg-black/80 border border-white/10 text-slate-200 rounded-lg px-3 py-2.5 text-sm outline-none input-glow transition mb-4 cursor-pointer" onchange="loadInterfaceProps()">
                        </select>
                    </div>

                    <div id="prop-ip-mask-container" class="space-y-4 bg-black/20 p-5 rounded-xl border border-white/5 relative overflow-hidden">
                        <div class="absolute top-0 right-0 w-24 h-24 bg-sky-500/5 rounded-full blur-2xl pointer-events-none"></div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">IPv4 Address</label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <i class="ph ph-globe text-slate-500"></i>
                                </div>
                                <input type="text" id="prop-ip" class="w-full bg-black/60 border border-white/10 text-sky-400 rounded-lg pl-9 pr-3 py-2.5 text-sm outline-none input-glow transition font-mono font-bold" placeholder="0.0.0.0" onchange="updateDeviceProp('ip')">
                            </div>
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">Subnet Mask</label>
                            <input type="text" id="prop-mask" class="w-full bg-black/60 border border-white/10 text-slate-300 rounded-lg px-3 py-2.5 text-sm outline-none input-glow transition font-mono" placeholder="255.255.255.0" onchange="updateDeviceProp('mask')">
                        </div>
                    </div>
                </div>
            </div>

            <!-- CLI Tab -->
            <div id="tab-cli" class="flex-1 cli-container p-4 hidden flex-col relative rounded-b-xl overflow-hidden m-3 border border-white/10">
                <div id="cli-output" class="whitespace-pre-wrap flex-1 break-words overflow-y-auto text-[13px] leading-relaxed pb-12 custom-scrollbar pr-2 z-10 relative"></div>
                <div class="flex items-center mt-2 shrink-0 absolute bottom-0 left-0 right-0 bg-black py-3 px-4 border-t border-white/10 z-10">
                    <span id="cli-prompt" class="font-bold text-sky-400">R1></span>
                    <input type="text" id="cli-input" class="cli-input ml-2 text-[13px] font-bold text-white font-mono" onkeydown="handleCliInput(event)" autocomplete="off" spellcheck="false" placeholder="_">
                </div>
            </div>
        </aside>

        <div id="pdu-panel" class="absolute bottom-6 right-6 w-[340px] glass-panel shadow-2xl rounded-xl flex flex-col z-30 overflow-hidden hidden transition-all duration-300 transform translate-y-4 opacity-0 border-white/10">
            <div class="bg-black/60 px-4 py-3 text-[10px] font-bold uppercase tracking-widest border-b border-white/5 flex justify-between items-center text-slate-300">
                <div class="flex items-center gap-2">
                    <i class="ph ph-radar text-sky-400 text-sm animate-pulse"></i> Matrix Events
                </div>
                <button onclick="clearPdus()" class="hover:text-rose-400 transition bg-white/5 hover:bg-white/10 border border-white/10 px-2 py-0.5 rounded outline-none">clear log</button>
            </div>
            <div id="pdu-list" class="h-52 overflow-y-auto text-[12px] p-3 space-y-2 custom-scrollbar bg-black/20">
                <div class="text-slate-500 text-center italic mt-16 font-mono text-[11px]">Monitoring network traffic...</div>
            </div>
        </div>
    </div>

    <footer class="h-32 glass-panel border-t border-white/10 flex z-40 shadow-[0_-15px_40px_rgba(0,0,0,0.6)] shrink-0 bg-cyber-bg/90">
        <!-- Category Selector -->
        <div class="w-24 bg-black/40 border-r border-white/5 flex flex-col shrink-0 py-2 gap-1 items-center justify-center">
            <button onclick="selectCategory('routers')" class="w-16 h-10 rounded-lg hover:bg-white/5 flex items-center justify-center transition group outline-none" id="cat-routers" title="Routers">
                <i class="ph ph-cpu text-2xl text-slate-500 group-hover:text-rose-500 transition-colors"></i>
            </button>
            <button onclick="selectCategory('switches')" class="w-16 h-10 rounded-lg hover:bg-white/5 flex items-center justify-center transition group outline-none" id="cat-switches" title="Switches">
                <i class="ph ph-share-network text-2xl text-slate-500 group-hover:text-emerald-500 transition-colors"></i>
            </button>
            <button onclick="selectCategory('end_devices')" class="w-16 h-10 rounded-lg flex items-center justify-center transition group bg-white/10 shadow-inner outline-none border border-white/5" id="cat-end_devices" title="End Devices">
                <i class="ph ph-desktop text-2xl text-sky-400 transition-colors"></i>
            </button>
        </div>
        
        <!-- Equipment List -->
        <div class="flex-1 px-6 py-4 flex gap-5 overflow-x-auto items-center bg-transparent custom-scrollbar" id="equipment-list">
            <!-- Dynamically populated via JS -->
        </div>
    </footer>

    <script>
        'use strict';

        // --- SVGs for device icons (Phosphor Icons adapted for pure SVG if needed, but using classes here) ---
        const ICONS = {
            router: `<i class="ph-fill ph-cpu text-rose-500"></i>`,
            switch: `<i class="ph-fill ph-share-network text-emerald-500"></i>`,
            pc: `<i class="ph-fill ph-desktop text-sky-400"></i>`,
            laptop: `<i class="ph-fill ph-laptop text-sky-400"></i>`,
            server: `<i class="ph-fill ph-hard-drives text-sky-400"></i>`,
            cloud: `<i class="ph-fill ph-cloud text-purple-400"></i>`
        };

        const CATEGORIES = {
            routers: [ 
                { id: 'vios', name: 'R', label: 'vIOS Router', type: 'router', color: 'rose' },
                { id: 'csr', name: 'CSR', label: 'CSR1000v', type: 'router', color: 'rose' }
            ],
            switches: [ 
                { id: 'l2', name: 'SW', label: 'L2 Switch', type: 'switch', color: 'emerald' },
                { id: 'l3', name: 'MLS', label: 'L3 Switch', type: 'switch', color: 'emerald' }
            ],
            end_devices: [
                { id: 'pc', name: 'PC', label: 'Desktop PC', type: 'pc', color: 'sky' },
                { id: 'laptop', name: 'Laptop', label: 'Laptop', type: 'laptop', color: 'sky' },
                { id: 'server', name: 'Server', label: 'Data Server', type: 'server', color: 'sky' },
                { id: 'cloud', name: 'Cloud', label: 'WAN Emulation', type: 'cloud', color: 'purple' }
            ]
        };

        // --- STATE ---
        let devices = [];
        let links = [];
        let deviceCounter = 1;
        
        let selectedTool = 'pointer';
        let currentCategory = 'end_devices';
        let itemToPlace = null;
        
        let activeDevice = null;
        let draggingDevice = null;
        let cableSourceDevice = null;
        let pingSourceDevice = null;

        // Command history per device
        const cliHistoryBuffer = {}; 

        // --- DOM Elements ---
        const workspace = document.getElementById('workspace');
        const devicesLayer = document.getElementById('devices-layer');
        const cablesLayer = document.getElementById('cables-layer');
        const drawingCableSvg = document.getElementById('drawing-cable');
        const drawingLine = document.getElementById('drawing-line');
        const toolStatus = document.getElementById('tool-status');
        const statusDot = document.getElementById('status-dot');

        // --- STREAMING_CHUNK: Utilities ---
        const generateMAC = () => "00:" + Array.from({length:5}, () => Math.floor(Math.random()*256).toString(16).padStart(2,'0')).join(':');
        const ipToLong = (ip) => {
            if(!ip) return 0;
            const parts = ip.split('.');
            if(parts.length !== 4) return 0;
            return parts.reduce((acc, octet) => (acc << 8) + parseInt(octet, 10), 0) >>> 0;
        };
        const isSameSubnet = (ip1, mask1, ip2, mask2) => {
            if(!ip1 || !mask1 || !ip2 || !mask2) return false;
            return (ipToLong(mask1) === ipToLong(mask2)) && ((ipToLong(ip1) & ipToLong(mask1)) === (ipToLong(ip2) & ipToLong(mask2)));
        };
        const getNetworkStr = (ip, mask) => {
            if(!ip || !mask) return "Unconfigured";
            let i = ip.split('.').map(Number);
            let m = mask.split('.').map(Number);
            if(i.length !== 4 || m.length !== 4) return "Invalid";
            let net = i.map((oct, idx) => oct & m[idx]).join('.');
            let cidr = m.reduce((acc, val) => acc + val.toString(2).split('1').length - 1, 0);
            return `${net}/${cidr}`;
        };

        // Calculates an elegant Bezier curve path between two points
        function calculateBezierPath(x1, y1, x2, y2) {
            // Add a slight curve based on horizontal/vertical distance
            const dx = Math.abs(x2 - x1);
            const dy = Math.abs(y2 - y1);
            const offset = Math.min(dx, dy) * 0.5;
            
            // Prefer vertical curves if mostly horizontal, else horizontal curves
            if (dx > dy) {
                return `M ${x1} ${y1} C ${x1 + offset} ${y1}, ${x2 - offset} ${y2}, ${x2} ${y2}`;
            } else {
                return `M ${x1} ${y1} C ${x1} ${y1 + offset}, ${x2} ${y2 - offset}, ${x2} ${y2}`;
            }
        }

        // --- STREAMING_CHUNK: Classes ---
        class NetworkDevice {
            constructor(typeStr, namePref, x, y) {
                this.id = 'dev_' + Date.now() + '_' + deviceCounter++;
                this.typeStr = typeStr;
                this.name = namePref + (deviceCounter - 1);
                this.x = x;
                this.y = y;
                this.cliOutput = [
                    `SwitchLab OS (tm) Software, Version 16.09(1)E`,
                    `Copyright (c) 1986-2026 by SwitchLab Systems, Inc.`,
                    `Compiled by sysadmin\n`,
                    `%SYS-5-RESTART: System restarted --`,
                    `Device ${this.name} initialized.\n`
                ];
                cliHistoryBuffer[this.id] = { cmds: [], index: -1 };
            }
            get isLayer3() { return ['pc', 'laptop', 'server', 'router'].includes(this.typeStr); }
        }

        class EndDevice extends NetworkDevice {
            constructor(typeStr, namePref, x, y) {
                super(typeStr, namePref, x, y);
                this.interfaces = [{ name: 'eth0', ip: '', mask: '255.255.255.0', mac: generateMAC(), connectedTo: null }];
                this.gateway = '';
                this.prompt = 'user@' + this.name.toLowerCase() + ':~$ ';
                this.cliOutput = [`Linux ${this.name.toLowerCase()} 6.2.0-generic #1 SMP PREEMPT_DYNAMIC x86_64\n`];
            }
        }

        class Router extends NetworkDevice {
            constructor(typeStr, namePref, x, y) {
                super(typeStr, namePref, x, y);
                this.interfaces = [
                    { name: 'GigabitEthernet0/0', ip: '', mask: '255.255.255.0', mac: generateMAC(), connectedTo: null },
                    { name: 'GigabitEthernet0/1', ip: '', mask: '255.255.255.0', mac: generateMAC(), connectedTo: null }
                ];
                this.prompt = this.name + '>';
            }
        }

        class Switch extends NetworkDevice {
            constructor(typeStr, namePref, x, y) {
                super(typeStr, namePref, x, y);
                this.interfaces = Array.from({length: 8}, (_, i) => ({ name: `Fa0/${i+1}`, mac: generateMAC(), connectedTo: null }));
                this.prompt = this.name + '>';
            }
        }

        class Cloud extends NetworkDevice {
            constructor(typeStr, namePref, x, y) {
                super(typeStr, namePref, x, y);
                this.interfaces = [{ name: 'WAN0', ip: '8.8.8.8', mask: '0.0.0.0', mac: generateMAC(), connectedTo: null }];
                this.prompt = 'cloud> ';
            }
        }

        // --- STREAMING_CHUNK: UI Interactions ---
        function selectCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.w-24 button').forEach(b => {
                b.classList.remove('bg-white/10', 'shadow-inner', 'border', 'border-white/5');
                const i = b.querySelector('i');
                i.className = i.className.replace(/text-(rose|emerald|sky|purple)-500/g, 'text-slate-500');
            });
            const activeBtn = document.getElementById('cat-' + cat);
            activeBtn.classList.add('bg-white/10', 'shadow-inner', 'border', 'border-white/5');
            
            let color = 'sky';
            if(cat === 'routers') color = 'rose';
            if(cat === 'switches') color = 'emerald';
            
            const i = activeBtn.querySelector('i');
            i.className = i.className.replace('text-slate-500', `text-${color}-500`);
            
            renderEquipmentList();
        }

        function renderEquipmentList() {
            const list = document.getElementById('equipment-list');
            list.innerHTML = '';
            CATEGORIES[currentCategory].forEach(item => {
                const btn = document.createElement('button');
                btn.className = `equipment-item flex flex-col items-center justify-center w-24 h-[90px] bg-black/40 border border-white/5 rounded-xl hover:bg-white/5 hover:border-${item.color}-500/50 transition-all shrink-0 outline-none group shadow-sm`;
                
                btn.innerHTML = `
                    <div class="w-10 h-10 mb-2 transition-transform duration-300 group-hover:-translate-y-1 flex items-center justify-center text-3xl opacity-70 group-hover:opacity-100">
                        ${ICONS[item.type]}
                    </div>
                    <span class="text-[10px] font-bold text-slate-400 text-center leading-tight group-hover:text-white transition-colors">${item.label}</span>
                `;
                
                btn.onclick = () => {
                    if(selectedTool !== 'pointer') setTool('pointer');
                    itemToPlace = item;
                    document.querySelectorAll('.equipment-item').forEach(el => el.classList.remove('ring-2', `ring-${item.color}-500`, 'bg-white/10'));
                    btn.classList.add('ring-2', `ring-${item.color}-500`, 'bg-white/10');
                    updateStatus(`Deploying ${item.label}...`, `animate-pulse bg-${item.color}-500 shadow-[0_0_10px_currentColor] text-${item.color}-500`);
                    workspace.style.cursor = 'crosshair';
                };
                list.appendChild(btn);
            });
        }

        function updateStatus(text, dotClass = 'bg-sky-500 shadow-[0_0_8px_rgba(14,165,233,0.8)]') {
            toolStatus.innerText = text;
            statusDot.className = `w-2 h-2 rounded-full mr-2 ${dotClass}`;
        }

        function setTool(tool) {
            selectedTool = tool;
            itemToPlace = null;
            
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('tool-active'));
            document.getElementById('tool-' + tool).classList.add('tool-active');
            document.querySelectorAll('.equipment-item').forEach(el => el.className = el.className.replace(/ring-2 ring-\w+-500 bg-white\/10/, ''));
            
            cableSourceDevice = null;
            pingSourceDevice = null;
            drawingCableSvg.classList.add('hidden');
            
            devices.forEach(d => {
                const el = document.getElementById(d.id);
                if(el) { el.classList.remove('ping-src', 'cable-src'); }
            });

            if(tool === 'pointer') { updateStatus('Select / Move', 'bg-sky-500 shadow-[0_0_8px_rgba(14,165,233,0.8)]'); workspace.style.cursor = 'default'; }
            if(tool === 'delete') { updateStatus('Delete Object', 'bg-rose-500 shadow-[0_0_8px_rgba(244,63,94,0.8)]'); workspace.style.cursor = 'crosshair'; closeProperties(); }
            if(tool === 'cable') { updateStatus('Connect (Click Src -> Dst)', 'bg-amber-400 shadow-[0_0_8px_rgba(245,158,11,0.8)] animate-pulse'); workspace.style.cursor = 'crosshair'; }
            if(tool === 'ping') { updateStatus('Send PDU (Click Src -> Dst)', 'bg-purple-500 shadow-[0_0_8px_rgba(168,85,247,0.8)] animate-pulse'); workspace.style.cursor = 'crosshair'; }
        }

        window.addEventListener('keydown', e => {
            if(e.target.tagName === 'INPUT' && e.target.id !== 'cli-input') return;
            
            if(e.key === 'Escape') { setTool('pointer'); closeProperties(); }
            if((e.key === 'Delete' || e.key === 'Backspace') && e.target.tagName !== 'INPUT') setTool('delete');
            if(e.key.toLowerCase() === 'c' && document.activeElement.tagName !== 'INPUT') setTool('cable');
            if(e.key.toLowerCase() === 'p' && document.activeElement.tagName !== 'INPUT') setTool('ping');
        });

        // --- STREAMING_CHUNK: Workspace Logic ---
        workspace.addEventListener('click', e => {
            if(e.target.closest('.device') || e.target.closest('.link-group')) return;

            if (itemToPlace) {
                const rect = workspace.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                let newDev;
                if(['pc', 'laptop', 'server'].includes(itemToPlace.type)) newDev = new EndDevice(itemToPlace.type, itemToPlace.name, x, y);
                else if (itemToPlace.type === 'router') newDev = new Router(itemToPlace.type, itemToPlace.name, x, y);
                else if (itemToPlace.type === 'switch') newDev = new Switch(itemToPlace.type, itemToPlace.name, x, y);
                else if (itemToPlace.type === 'cloud') newDev = new Cloud(itemToPlace.type, itemToPlace.name, x, y);

                if(newDev) { devices.push(newDev); renderDevice(newDev); }
                
                itemToPlace = null;
                setTool('pointer');
            } 
            else if (selectedTool === 'pointer') {
                closeProperties();
                devices.forEach(d => document.getElementById(d.id)?.classList.remove('selected'));
            } 
            else if (selectedTool === 'cable' && cableSourceDevice) {
                document.getElementById(cableSourceDevice.id)?.classList.remove('cable-src');
                cableSourceDevice = null;
                drawingCableSvg.classList.add('hidden');
            } 
            else if (selectedTool === 'ping' && pingSourceDevice) {
                pingSourceDevice = null;
                devices.forEach(d => document.getElementById(d.id)?.classList.remove('ping-src'));
            }
        });

        workspace.addEventListener('mousemove', e => {
            const rect = workspace.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;

            if (draggingDevice && selectedTool === 'pointer') {
                draggingDevice.x = Math.max(40, Math.min(mx, rect.width - 40));
                draggingDevice.y = Math.max(40, Math.min(my, rect.height - 40));
                const el = document.getElementById(draggingDevice.id);
                el.style.left = draggingDevice.x + 'px';
                el.style.top = draggingDevice.y + 'px';
                drawLinks();
            }

            if (selectedTool === 'cable' && cableSourceDevice) {
                drawingLine.setAttribute('d', calculateBezierPath(cableSourceDevice.x, cableSourceDevice.y, mx, my));
            }
        });

        window.addEventListener('mouseup', () => { draggingDevice = null; });

        // --- STREAMING_CHUNK: Device & Link Rendering ---
        function renderDevice(dev) {
            const el = document.createElement('div');
            el.className = 'device';
            el.id = dev.id;
            el.style.left = dev.x + 'px';
            el.style.top = dev.y + 'px';

            el.innerHTML = `
                <div class="device-icon-wrapper">${ICONS[dev.typeStr]}</div>
                <div class="device-label">${dev.name}</div>
                ${dev.isLayer3 && dev.interfaces[0].ip ? `<div class="device-ip-label">${dev.interfaces[0].ip}</div>` : ''}
            `;

            el.addEventListener('mousedown', e => { if(selectedTool === 'pointer' && e.button === 0) draggingDevice = dev; });

            el.addEventListener('click', e => {
                e.stopPropagation();
                if (selectedTool === 'pointer') {
                    devices.forEach(d => document.getElementById(d.id)?.classList.remove('selected'));
                    el.classList.add('selected');
                    openProperties(dev);
                } 
                else if (selectedTool === 'delete') { deleteDevice(dev); }
                else if (selectedTool === 'cable') {
                    if (!cableSourceDevice) {
                        cableSourceDevice = dev;
                        el.classList.add('cable-src');
                        drawingCableSvg.classList.remove('hidden');
                        drawingLine.setAttribute('d', calculateBezierPath(dev.x, dev.y, dev.x, dev.y));
                        updateStatus(`Connecting ${dev.name}...`, 'bg-amber-500 animate-pulse');
                    } else {
                        if (cableSourceDevice.id !== dev.id) createLink(cableSourceDevice, dev);
                        document.getElementById(cableSourceDevice.id)?.classList.remove('cable-src');
                        cableSourceDevice = null;
                        drawingCableSvg.classList.add('hidden');
                        setTool('pointer');
                    }
                }
                else if (selectedTool === 'ping') {
                    if (!pingSourceDevice) {
                        if(dev.isLayer3) {
                            pingSourceDevice = dev;
                            el.classList.add('ping-src');
                            updateStatus(`Pinging from ${dev.name}...`, 'bg-purple-500 shadow-[0_0_8px_rgba(168,85,247,0.8)] animate-pulse');
                        } else {
                            showModal('Invalid Source', 'Ping source must be a Layer 3 Device (PC, Server, Router).', 'info');
                            setTool('pointer');
                        }
                    } else {
                        if (pingSourceDevice.id !== dev.id && dev.isLayer3) {
                            let targetIp = dev.interfaces.find(i => i.ip)?.ip;
                            if(!targetIp) {
                                addPduLog(pingSourceDevice.name, dev.name, 'ICMP', 'Target Unconfigured');
                            } else {
                                openProperties(pingSourceDevice);
                                switchTab('cli');
                                executePing(pingSourceDevice, targetIp, dev);
                            }
                        }
                        const pSrcEl = document.getElementById(pingSourceDevice.id);
                        if(pSrcEl) pSrcEl.classList.remove('ping-src');
                        pingSourceDevice = null;
                        setTool('pointer');
                    }
                }
            });
            devicesLayer.appendChild(el);
        }

        function updateDeviceDOM(dev) {
            const el = document.getElementById(dev.id);
            if(!el) return;
            el.querySelector('.device-label').innerText = dev.name;
            
            let primaryIp = dev.interfaces.find(i => i.ip)?.ip || '';
            let ipLabel = el.querySelector('.device-ip-label');
            
            if(primaryIp) {
                if(ipLabel) ipLabel.innerText = primaryIp;
                else {
                    const nl = document.createElement('div');
                    nl.className = 'device-ip-label';
                    nl.innerText = primaryIp;
                    el.appendChild(nl);
                }
            } else if (ipLabel) ipLabel.remove();
        }

        function getFreeInterface(dev) {
            return dev.interfaces.findIndex(i => !i.connectedTo);
        }

        function createLink(dev1, dev2) {
            if(links.some(l => (l.sourceId === dev1.id && l.targetId === dev2.id) || (l.sourceId === dev2.id && l.targetId === dev1.id))) return;
            
            const idx1 = getFreeInterface(dev1);
            const idx2 = getFreeInterface(dev2);
            
            if(idx1 === -1 || idx2 === -1) {
                showModal('Connection Error', 'One of the devices has no available physical ports.', 'info');
                return;
            }

            const linkId = 'link_' + Date.now();
            dev1.interfaces[idx1].connectedTo = linkId;
            dev2.interfaces[idx2].connectedTo = linkId;

            links.push({ id: linkId, sourceId: dev1.id, srcIntf: idx1, targetId: dev2.id, tgtIntf: idx2 });
            drawLinks();
        }

        function drawLinks() {
            cablesLayer.innerHTML = '';
            links.forEach(l => {
                const s = devices.find(d => d.id === l.sourceId);
                const t = devices.find(d => d.id === l.targetId);
                if(!s || !t) return;
                
                const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                group.classList.add('link-group');

                const pathD = calculateBezierPath(s.x, s.y, t.x, t.y);

                const line = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                line.setAttribute('d', pathD);
                line.classList.add('link-line');

                const hitArea = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                hitArea.setAttribute('d', pathD);
                hitArea.classList.add('link-hit-area');
                
                group.addEventListener('click', e => {
                    e.stopPropagation();
                    if(selectedTool === 'delete') {
                        s.interfaces[l.srcIntf].connectedTo = null;
                        t.interfaces[l.tgtIntf].connectedTo = null;
                        links = links.filter(lk => lk.id !== l.id);
                        drawLinks();
                        setTool('pointer');
                    }
                });

                group.appendChild(line);
                group.appendChild(hitArea);

                // Port Lights & Labels
                const isRouterLink = s.typeStr === 'router' || t.typeStr === 'router';
                const sState = (s.typeStr === 'router' && !s.interfaces[l.srcIntf].ip) ? 'down' : '';
                const tState = (t.typeStr === 'router' && !t.interfaces[l.tgtIntf].ip) ? 'down' : '';

                // Calculate positions along the path (approximate for SVG paths without getPointAtLength)
                // For simplicity in single-file, we interpolate linearly for the dots, which looks fine for our gentle curves
                const px1 = s.x + (t.x - s.x) * 0.15;
                const py1 = s.y + (t.y - s.y) * 0.15;
                const px2 = t.x + (s.x - t.x) * 0.15;
                const py2 = t.y + (s.y - t.y) * 0.15;

                const dotS = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                dotS.setAttribute('cx', px1); dotS.setAttribute('cy', py1); dotS.setAttribute('r', 4);
                dotS.setAttribute('class', `port-light ${sState}`);
                
                const dotT = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                dotT.setAttribute('cx', px2); dotT.setAttribute('cy', py2); dotT.setAttribute('r', 4);
                dotT.setAttribute('class', `port-light ${tState}`);

                // Labels
                const lblS = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                lblS.setAttribute('x', s.x + (t.x - s.x) * 0.22); lblS.setAttribute('y', s.y + (t.y - s.y) * 0.22 + 3);
                lblS.classList.add('port-label');
                lblS.textContent = s.interfaces[l.srcIntf].name.replace(/[a-z]/gi, '').substring(0,3); // Abbreviate

                const lblT = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                lblT.setAttribute('x', t.x + (s.x - t.x) * 0.22); lblT.setAttribute('y', t.y + (s.y - t.y) * 0.22 + 3);
                lblT.classList.add('port-label');
                lblT.textContent = t.interfaces[l.tgtIntf].name.replace(/[a-z]/gi, '').substring(0,3);

                group.appendChild(dotS); group.appendChild(dotT);
                group.appendChild(lblS); group.appendChild(lblT);
                cablesLayer.appendChild(group);
            });
        }

        function deleteDevice(dev) {
            if(activeDevice && activeDevice.id === dev.id) closeProperties();
            document.getElementById(dev.id).remove();
            devices = devices.filter(d => d.id !== dev.id);
            links = links.filter(l => {
                if(l.sourceId === dev.id || l.targetId === dev.id) {
                    // Free up the interface on the surviving device
                    const survivor = devices.find(d => d.id === (l.sourceId === dev.id ? l.targetId : l.sourceId));
                    if(survivor) {
                        const intfIdx = l.sourceId === dev.id ? l.tgtIntf : l.srcIntf;
                        survivor.interfaces[intfIdx].connectedTo = null;
                    }
                    return false;
                }
                return true;
            });
            drawLinks();
            setTool('pointer');
        }

        // --- STREAMING_CHUNK: Properties Panel & CLI UI ---
        function showModal(title, message, type = 'info', onConfirm = null) {
            const modal = document.getElementById('custom-modal');
            const content = document.getElementById('custom-modal-content');
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;
            
            const actions = document.getElementById('modal-actions');
            actions.innerHTML = '';
            
            if (type === 'confirm') {
                actions.innerHTML = `
                    <button onclick="closeModal()" class="px-4 py-2 rounded-lg text-sm font-bold text-slate-400 hover:text-white hover:bg-white/10 transition outline-none">Cancel</button>
                    <button id="modal-confirm-btn" class="px-5 py-2 rounded-lg text-sm font-bold bg-rose-600 text-white hover:bg-rose-500 transition outline-none shadow-[0_0_15px_rgba(225,29,72,0.4)]">Execute</button>
                `;
                document.getElementById('modal-confirm-btn').onclick = () => { if(onConfirm) onConfirm(); closeModal(); };
            } else {
                actions.innerHTML = `<button onclick="closeModal()" class="px-6 py-2 rounded-lg text-sm font-bold bg-sky-600 hover:bg-sky-500 text-white transition outline-none shadow-[0_0_15px_rgba(14,165,233,0.4)]">Acknowledge</button>`;
            }

            modal.classList.remove('hidden');
            void modal.offsetWidth;
            modal.classList.remove('opacity-0');
            content.classList.remove('scale-95');
        }

        function closeModal() {
            const m = document.getElementById('custom-modal');
            const c = document.getElementById('custom-modal-content');
            m.classList.add('opacity-0'); c.classList.add('scale-95');
            setTimeout(() => m.classList.add('hidden'), 300);
        }

        function promptClearWorkspace() {
            showModal('Purge Matrix', 'Critical: This will eradicate all deployed nodes and links. Proceed?', 'confirm', () => {
                devicesLayer.innerHTML = ''; cablesLayer.innerHTML = ''; document.getElementById('packets-layer').innerHTML = '';
                devices = []; links = []; deviceCounter = 1;
                closeProperties(); clearPdus();
            });
        }

        const panel = document.getElementById('properties-panel');
        const cliOutput = document.getElementById('cli-output');
        const cliPrompt = document.getElementById('cli-prompt');
        const cliInput = document.getElementById('cli-input');

        function openProperties(dev) {
            activeDevice = dev;
            document.getElementById('prop-header-title').innerText = dev.name;
            document.getElementById('prop-header-mac').innerText = dev.interfaces[0].mac;
            document.getElementById('prop-small-icon').innerHTML = ICONS[dev.typeStr];
            document.getElementById('prop-name').value = dev.name;

            const gwCont = document.getElementById('prop-gateway-container');
            const intCont = document.getElementById('prop-interface-container');
            const ipMaskCont = document.getElementById('prop-ip-mask-container');

            gwCont.classList.add('hidden'); intCont.classList.add('hidden'); ipMaskCont.classList.remove('hidden');

            if (['pc', 'laptop', 'server'].includes(dev.typeStr)) {
                gwCont.classList.remove('hidden');
                document.getElementById('prop-gateway').value = dev.gateway || '';
                document.getElementById('prop-ip').value = dev.interfaces[0].ip || '';
                document.getElementById('prop-mask').value = dev.interfaces[0].mask || '';
            } 
            else if (dev.typeStr === 'router') {
                intCont.classList.remove('hidden');
                const sel = document.getElementById('prop-interface-sel');
                sel.innerHTML = dev.interfaces.map((intf, idx) => `<option value="${idx}">${intf.name} ${intf.connectedTo?'(UP)':'(DOWN)'}</option>`).join('');
                loadInterfaceProps();
            }
            else if (['switch', 'cloud'].includes(dev.typeStr)) {
                ipMaskCont.classList.add('hidden');
            }

            renderCli();
            panel.classList.remove('translate-x-full');
            switchTab('config');
        }

        function loadInterfaceProps() {
            if(!activeDevice || activeDevice.typeStr !== 'router') return;
            const idx = document.getElementById('prop-interface-sel').value;
            const intf = activeDevice.interfaces[idx];
            document.getElementById('prop-ip').value = intf.ip || '';
            document.getElementById('prop-mask').value = intf.mask || '';
            document.getElementById('prop-header-mac').innerText = intf.mac;
        }

        function closeProperties() { panel.classList.add('translate-x-full'); activeDevice = null; }

        function switchTab(tab) {
            const c = document.getElementById('tab-config'), cli = document.getElementById('tab-cli');
            const bc = document.getElementById('tab-btn-config'), bcli = document.getElementById('tab-btn-cli');
            if(tab === 'config') {
                c.classList.remove('hidden'); cli.classList.replace('flex', 'hidden');
                bc.classList.add('border-sky-500', 'text-sky-400'); bc.classList.remove('border-transparent', 'text-slate-400');
                bcli.classList.remove('border-sky-500', 'text-sky-400'); bcli.classList.add('border-transparent', 'text-slate-400');
            } else {
                c.classList.add('hidden'); cli.classList.replace('hidden', 'flex');
                bcli.classList.add('border-sky-500', 'text-sky-400'); bcli.classList.remove('border-transparent', 'text-slate-400');
                bc.classList.remove('border-sky-500', 'text-sky-400'); bc.classList.add('border-transparent', 'text-slate-400');
                setTimeout(() => { cliInput.focus(); cliOutput.scrollTop = cliOutput.scrollHeight; }, 50);
            }
        }

        function updateDeviceProp(prop) {
            if(!activeDevice) return;
            if(prop === 'name') {
                let newName = document.getElementById('prop-name').value.trim();
                if(newName) {
                    activeDevice.name = newName;
                    if(['router', 'switch'].includes(activeDevice.typeStr)) {
                        activeDevice.prompt = activeDevice.prompt.replace(/^.*?[>#]/, newName + (activeDevice.prompt.includes('#') ? '#' : '>'));
                    } else { activeDevice.prompt = 'user@' + newName.toLowerCase() + ':~$ '; }
                    document.getElementById('prop-header-title').innerText = newName;
                }
            } 
            else if(prop === 'gateway') activeDevice.gateway = document.getElementById('prop-gateway').value.trim();
            else if(prop === 'ip' || prop === 'mask') {
                let val = document.getElementById('prop-' + prop).value.trim();
                if(['pc', 'laptop', 'server'].includes(activeDevice.typeStr)) activeDevice.interfaces[0][prop] = val;
                else if(activeDevice.typeStr === 'router') activeDevice.interfaces[document.getElementById('prop-interface-sel').value][prop] = val;
                drawLinks(); // Re-eval link colors
            }
            updateDeviceDOM(activeDevice);
            renderCli();
        }

        // --- STREAMING_CHUNK: CLI Engine ---
        function printCli(text) {
            if(!activeDevice) return;
            activeDevice.cliOutput.push(text);
            renderCli();
        }

        function renderCli() {
            if(!activeDevice) return;
            cliOutput.textContent = activeDevice.cliOutput.join('\n');
            cliPrompt.innerText = activeDevice.prompt;
            requestAnimationFrame(() => cliOutput.scrollTop = cliOutput.scrollHeight);
        }

        function handleCliInput(e) {
            if(!activeDevice) return;
            const buf = cliHistoryBuffer[activeDevice.id];
            
            if(e.key === 'Enter') {
                let cmd = e.target.value.trim();
                e.target.value = '';
                if(cmd) {
                    buf.cmds.push(cmd);
                    buf.index = buf.cmds.length;
                }
                printCli(activeDevice.prompt + cmd);
                processCommand(activeDevice, cmd);
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if(buf.index > 0) {
                    buf.index--;
                    e.target.value = buf.cmds[buf.index];
                }
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                if(buf.index < buf.cmds.length - 1) {
                    buf.index++;
                    e.target.value = buf.cmds[buf.index];
                } else {
                    buf.index = buf.cmds.length;
                    e.target.value = '';
                }
            }
        }

        function processCommand(dev, cmd) {
            if(!cmd) return;
            let args = cmd.split(' ').filter(x=>x);
            let base = args[0].toLowerCase();
            
            if (['pc', 'laptop', 'server'].includes(dev.typeStr)) {
                if(base === 'ping') {
                    if(args.length < 2) return printCli("Usage: ping <ip_address>");
                    executePing(dev, args[1], null);
                } else if(base === 'traceroute' || base === 'tracert') {
                    if(args.length < 2) return printCli("Usage: traceroute <ip_address>");
                    executeTraceroute(dev, args[1]);
                } else if (base === 'ipconfig' || base === 'ifconfig' || base === 'ip') {
                    let i = dev.interfaces[0];
                    printCli(`\neth0: flags=4163<UP,BROADCAST,RUNNING,MULTICAST>  mtu 1500\n        inet ${i.ip || '0.0.0.0'}  netmask ${i.mask || '0.0.0.0'}\n        ether ${i.mac}  txqueuelen 1000\n        Gateway: ${dev.gateway || '0.0.0.0'}\n`);
                } else if (base === 'arp') {
                    printCli("\nAddress                  HWtype  HWaddress           Flags Mask            Iface\n192.168.1.1              ether   00:1a:2b:3c:4d:5e   C                     eth0\n");
                } else if (base === 'clear') {
                    dev.cliOutput = []; renderCli();
                } else printCli(`bash: ${base}: command not found`);
            } 
            else if (['router', 'switch'].includes(dev.typeStr)) {
                if (base === 'enable' || base === 'en') dev.prompt = dev.name + '#';
                else if (base === 'disable') dev.prompt = dev.name + '>';
                else if ((base === 'configure' || base === 'conf') && (args[1] === 'terminal' || args[1] === 't')) {
                    if(dev.prompt.includes('#')) dev.prompt = dev.name + '(config)#'; else printCli('% Incomplete command.');
                } else if (base === 'exit') {
                    if(dev.prompt.includes('(config)')) dev.prompt = dev.name + '#'; else dev.prompt = dev.name + '>';
                } else if (base === 'show' || base === 'sh') {
                    if(args[1] === 'ip' && args[2] === 'route') {
                        printCli("Codes: L - local, C - connected, S - static\nGateway of last resort is not set\n");
                        let found = false;
                        dev.interfaces.forEach(i => {
                            if(i.ip && i.mask) { printCli(`C    ${getNetworkStr(i.ip, i.mask)} is directly connected, ${i.name}`); found = true; }
                        });
                        if(!found) printCli("Routing table is empty.");
                    } else if (args[1] === 'ip' && args[2] === 'int' && args[3] === 'brief') {
                        printCli(`Interface                  IP-Address      OK? Method Status                Protocol`);
                        dev.interfaces.forEach(i => printCli(`${i.name.padEnd(26)} ${i.ip ? i.ip.padEnd(15) : 'unassigned     '} YES manual ${i.connectedTo?'up                    up':'down                  down'}`));
                    } else printCli(`% Invalid input detected.`);
                } else printCli(`% Unknown command.`);
                renderCli();
            }
        }

        // --- STREAMING_CHUNK: Advanced Simulation Logic ---
        function getPhysicalNeighbors(deviceId) {
            let n = [];
            links.forEach(l => {
                if(l.sourceId === deviceId) n.push(devices.find(d=>d.id===l.targetId));
                if(l.targetId === deviceId) n.push(devices.find(d=>d.id===l.sourceId));
            });
            return n.filter(Boolean);
        }

        // Simulates ARP / finding layer 2 connected graph
        function getBroadcastDomain(startDev) {
            let q = [startDev], visited = new Set([startDev.id]), domain = [];
            while(q.length > 0) {
                let curr = q.shift();
                domain.push(curr);
                if (curr.typeStr === 'switch' || curr.id === startDev.id) {
                    getPhysicalNeighbors(curr.id).forEach(n => {
                        if(!visited.has(n.id)) { visited.add(n.id); q.push(n); }
                    });
                }
            }
            return domain;
        }

        function findLayer2Path(startDev, targetDev) {
            let q = [{ dev: startDev, path: [startDev] }], visited = new Set([startDev.id]);
            while(q.length > 0) {
                let {dev, path} = q.shift();
                if(dev.id === targetDev.id) return path;
                if (dev.typeStr === 'switch' || dev.id === startDev.id) {
                    getPhysicalNeighbors(dev.id).forEach(n => {
                        if(!visited.has(n.id)) { visited.add(n.id); q.push({ dev: n, path: [...path, n] }); }
                    });
                }
            }
            return null;
        }

        function findTargetDeviceByIp(ip) {
            return devices.find(d => {
                if(['pc','laptop','server'].includes(d.typeStr) && d.interfaces[0].ip === ip) return true;
                if(d.typeStr === 'router' && d.interfaces.some(i => i.ip === ip)) return true;
                if(d.typeStr === 'cloud' && d.interfaces[0].ip === ip) return true;
                return false;
            });
        }

        function traceRouteLogic(srcDevice, targetIp) {
            let srcIp = srcDevice.interfaces[0].ip;
            let srcMask = srcDevice.interfaces[0].mask;
            
            // 1. Same Subnet
            if (isSameSubnet(srcIp, srcMask, targetIp, srcMask)) {
                let targetDev = findTargetDeviceByIp(targetIp);
                if(!targetDev) return { success: false, error: "Destination host unreachable.", hops: [] };
                let path = findLayer2Path(srcDevice, targetDev);
                if(path) return { success: true, path: path, hops: [targetDev] };
                else return { success: false, error: "Request timed out.", hops: [] };
            } 
            // 2. Different Subnet (Needs Gateway)
            else {
                let gwIp = srcDevice.gateway;
                if(!gwIp) return { success: false, error: "Network is unreachable.", hops: [] };

                let bd = getBroadcastDomain(srcDevice);
                let router = bd.find(d => d.typeStr === 'router' && d.interfaces.some(i => i.ip === gwIp));
                if(!router) return { success: false, error: `Reply from ${srcIp}: Destination host unreachable.`, hops: [] };

                // Router Routing Logic
                let targetDev = findTargetDeviceByIp(targetIp);
                if(!targetDev) return { success: false, error: `Reply from ${gwIp}: Destination net unreachable.`, hops: [router] };

                // Is the target connected to the router?
                let outIntf = router.interfaces.find(i => i.ip && isSameSubnet(i.ip, i.mask, targetIp, i.mask));
                if(!outIntf) return { success: false, error: `Reply from ${gwIp}: Destination net unreachable.`, hops: [router] };

                let path2 = findLayer2Path(router, targetDev);
                if(!path2) return { success: false, error: "Request timed out.", hops: [router] };

                let path1 = findLayer2Path(srcDevice, router);
                return { success: true, path: path1.concat(path2.slice(1)), hops: [router, targetDev] };
            }
        }

        async function executePing(source, targetIp) {
            printCli(`\nPING ${targetIp} (${targetIp}) 56(84) bytes of data.`);
            if(!source.interfaces[0].ip) {
                printCli("connect: Network is unreachable");
                addPduLog(source.name, targetIp, 'ICMP', 'Failed');
                return;
            }

            let result = traceRouteLogic(source, targetIp);
            let successes = 0;

            for(let i=0; i<4; i++) {
                await new Promise(r => setTimeout(r, 600));
                
                if(result.success) {
                    animatePacket(result.path);
                    let animTime = (result.path.length - 1) * 400 * 2;
                    await new Promise(r => setTimeout(r, animTime));
                    
                    let time = Math.floor(Math.random()*15)+1;
                    printCli(`64 bytes from ${targetIp}: icmp_seq=${i+1} ttl=64 time=${time} ms`);
                    successes++;
                    
                    flashDevice(result.path[result.path.length-1].id, 'rgba(16, 185, 129, 0.8)');
                    if(i===0) addPduLog(source.name, targetIp, 'ICMP Echo', 'Success');
                } else {
                    animatePacket(result.path || [source], true);
                    await new Promise(r => setTimeout(r, 600));
                    printCli(`From ${result.error.includes('Reply') ? result.error.split(' ')[2] : source.interfaces[0].ip} icmp_seq=${i+1} ${result.error}`);
                    if(i===0) addPduLog(source.name, targetIp, 'ICMP Drop', 'Dropped');
                }
            }
            printCli(`\n--- ${targetIp} ping statistics ---`);
            printCli(`4 packets transmitted, ${successes} received, ${(4-successes)*25}% packet loss, time ${Math.floor(Math.random()*1500)+500}ms\n`);
        }

        async function executeTraceroute(source, targetIp) {
            printCli(`\ntraceroute to ${targetIp}, 30 hops max, 60 byte packets`);
            let result = traceRouteLogic(source, targetIp);
            
            if(result.hops && result.hops.length > 0) {
                for(let i=0; i<result.hops.length; i++) {
                    await new Promise(r => setTimeout(r, 800));
                    let hop = result.hops[i];
                    let ipToLog = hop.id === findTargetDeviceByIp(targetIp)?.id ? targetIp : hop.interfaces.find(intf => intf.ip)?.ip;
                    printCli(` ${i+1}  ${ipToLog} (${ipToLog})  ${Math.floor(Math.random()*10)+1} ms  ${Math.floor(Math.random()*10)+1} ms`);
                }
                if(!result.success) {
                    await new Promise(r => setTimeout(r, 800));
                    printCli(` ${result.hops.length + 1}  * * *`);
                    printCli(` ${result.hops.length + 2}  * * *`);
                }
            } else {
                await new Promise(r => setTimeout(r, 800));
                printCli(` 1  * * *`);
                printCli(` 2  * * *`);
            }
            printCli("");
        }

        function flashDevice(id, color) {
            const el = document.getElementById(id);
            if(el) {
                const icon = el.querySelector('.device-icon-wrapper');
                icon.style.boxShadow = `0 0 30px ${color}, inset 0 0 15px ${color}`;
                setTimeout(() => icon.style.boxShadow = '', 400);
            }
        }

        function animatePacket(path, isError = false) {
            if(!path || path.length < 1) return;
            const pktLayer = document.getElementById('packets-layer');
            const pkt = document.createElement('div');
            pkt.className = `packet ${isError ? 'error' : ''}`;
            
            pkt.style.left = path[0].x + 'px'; pkt.style.top = path[0].y + 'px';
            pktLayer.appendChild(pkt);

            if(path.length === 1) {
                setTimeout(() => pkt.remove(), 400);
                return;
            }

            let step = 1, goingBack = false;

            function move() {
                if(!goingBack && step >= path.length) {
                    if(isError) { pkt.remove(); return; }
                    goingBack = true; step = path.length - 2;
                    pkt.classList.add('return');
                }
                if(goingBack && step < 0) { pkt.remove(); return; }

                pkt.style.left = path[step].x + 'px';
                pkt.style.top = path[step].y + 'px';

                if(goingBack) step--; else step++;
                setTimeout(move, 400); 
            }
            setTimeout(move, 50);
        }

        // --- STREAMING_CHUNK: Logging & Persistence ---
        function addPduLog(src, dest, type, status) {
            const panel = document.getElementById('pdu-panel');
            panel.classList.remove('hidden');
            setTimeout(() => panel.classList.remove('opacity-0', 'translate-y-4'), 10);
            
            const list = document.getElementById('pdu-list');
            if(list.innerHTML.includes('Monitoring')) list.innerHTML = '';
            
            let color = status === 'Success' ? 'text-emerald-400 bg-emerald-500/10 border-emerald-500/20' : 'text-rose-400 bg-rose-500/10 border-rose-500/20';
            
            let html = `
                <div class="border rounded-lg px-3 py-2 flex items-center justify-between shadow-sm mb-2 ${color} backdrop-blur-md">
                    <div class="flex flex-col gap-0.5">
                        <span class="font-bold font-mono tracking-tight text-[11px]">${type}</span>
                        <span class="text-[9px] text-slate-400 font-mono">${src} <i class="ph ph-arrow-right"></i> ${dest}</span>
                    </div>
                    <span class="font-bold text-[9px] uppercase tracking-widest bg-black/40 px-2 py-1 rounded">${status}</span>
                </div>
            `;
            list.insertAdjacentHTML('afterbegin', html);
        }

        function clearPdus() {
            document.getElementById('pdu-list').innerHTML = '<div class="text-slate-500 text-center italic mt-16 font-mono text-[11px]">Monitoring network traffic...</div>';
        }

        function saveTopology() {
            const data = { devices, links, deviceCounter };
            localStorage.setItem('wpt_switchlab_ultra', JSON.stringify(data));
            showModal('Matrix Saved', 'Neural topology encrypted and stored in local cache.', 'info');
        }

        function loadTopology() {
            const dataStr = localStorage.getItem('wpt_switchlab_ultra');
            if(!dataStr) return showModal('No Cache', 'No saved topology found in local storage.', 'info');
            
            showModal('Load Matrix', 'Loading will overwrite your current configuration. Proceed?', 'confirm', () => {
                devicesLayer.innerHTML = ''; cablesLayer.innerHTML = ''; document.getElementById('packets-layer').innerHTML = '';
                devices = []; links = []; closeProperties(); clearPdus();
                
                try {
                    const data = JSON.parse(dataStr);
                    deviceCounter = data.deviceCounter;
                    
                    data.devices.forEach(d => {
                        let newDev;
                        if(['pc','laptop','server'].includes(d.typeStr)) newDev = new EndDevice(d.typeStr, 'x', d.x, d.y);
                        else if(d.typeStr === 'router') newDev = new Router(d.typeStr, 'x', d.x, d.y);
                        else if(d.typeStr === 'switch') newDev = new Switch(d.typeStr, 'x', d.x, d.y);
                        else if(d.typeStr === 'cloud') newDev = new Cloud(d.typeStr, 'x', d.x, d.y);
                        
                        Object.assign(newDev, d);
                        cliHistoryBuffer[newDev.id] = { cmds: [], index: -1 };
                        devices.push(newDev); renderDevice(newDev); updateDeviceDOM(newDev);
                    });
                    data.links.forEach(l => links.push(l)); drawLinks();
                } catch(e) {
                    showModal('Corruption Error', 'Failed to decode saved topology data.', 'info');
                }
            });
        }

        // --- STREAMING_CHUNK: Boot Sequence ---
        window.onload = () => {
            selectCategory('routers');
            
            // Build impressive default demo
            let r1 = new Router('router', 'R1-Core', window.innerWidth/2, 200); 
            r1.interfaces[0].ip = '10.0.0.1'; r1.interfaces[0].mask = '255.255.255.0'; 
            r1.interfaces[1].ip = '192.168.1.1'; r1.interfaces[1].mask = '255.255.255.0';
            
            let sw1 = new Switch('switch', 'SW-Dist-A', window.innerWidth/2 + 200, 350);
            
            let pc1 = new EndDevice('pc', 'Terminal-01', window.innerWidth/2 + 100, 500); 
            pc1.interfaces[0].ip = '192.168.1.10'; pc1.gateway = '192.168.1.1';
            
            let srv = new EndDevice('server', 'DataCenter-01', window.innerWidth/2 + 300, 500); 
            srv.interfaces[0].ip = '192.168.1.100'; srv.gateway = '192.168.1.1';

            let cld = new Cloud('cloud', 'Internet', window.innerWidth/2 - 200, 200);

            [r1, sw1, pc1, srv, cld].forEach(d => { devices.push(d); renderDevice(d); updateDeviceDOM(d); });
            
            createLink(cld, r1);
            createLink(r1, sw1);
            createLink(sw1, pc1);
            createLink(sw1, srv);
        };
    </script>
